appId: com.eduboard.app
productName: EduBoard
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.node.tsbuildinfo,tsconfig.web.tsbuildinfo}'
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**
win:
  # electron-builder signs automatically when CSC_LINK/CSC_KEY_PASSWORD are set in the
  # environment (see docs/CODE_SIGNING.md) — no explicit certificateFile config needed,
  # and builds without those env vars stay unsigned exactly as before.
  executableName: EduBoard
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
nsis:
  artifactName: ${productName}-Setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
portable:
  artifactName: ${productName}-Portable.${ext}
mac:
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  artifactName: ${productName}.${ext}
  # better-sqlite3 ships prebuilt native binaries for every platform as plain
  # package content (unrelated to the one @electron/rebuild actually compiles
  # for this Electron ABI). Those extra files are byte-identical between the
  # x64 and arm64 halves of a universal build, which @electron/universal
  # otherwise refuses to merge — this tells it that's expected.
  x64ArchFiles: 'Contents/Resources/app.asar.unpacked/node_modules/better-sqlite3/**'
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: EduBoard stores your class data in a local database file.
    - NSDownloadsFolderUsageDescription: EduBoard can export reports and backups to your Downloads folder.
  # Hardened runtime is required for notarization. Actual signing/notarization only
  # happens when the relevant env vars are present (see docs/CODE_SIGNING.md) — with
  # none set, electron-builder falls back to an unsigned, non-notarized build exactly
  # as before, so this is a no-op for anyone who hasn't set up a certificate.
  hardenedRuntime: true
dmg:
  artifactName: ${productName}.${ext}
linux:
  target:
    - AppImage
  category: Education
  syncDesktopName: true
appImage:
  artifactName: ${productName}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: purysho
  repo: EduBoard
  releaseType: release
