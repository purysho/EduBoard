appId: com.eduboard.app
productName: EduBoard
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.node.tsbuildinfo,tsconfig.web.tsbuildinfo}'
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**
win:
  # electron-builder signs automatically when CSC_LINK/CSC_KEY_PASSWORD are set in the
  # environment (see docs/CODE_SIGNING.md) — no explicit certificateFile config needed,
  # and builds without those env vars stay unsigned exactly as before.
  executableName: EduBoard
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
nsis:
  artifactName: ${productName}-Setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
portable:
  artifactName: ${productName}-Portable.${ext}
mac:
  # One download per chip rather than a single "universal" app: each gets the native
  # modules (better-sqlite3, pdf-parse's canvas) built for its own chip, which the
  # universal merge can't do. build:mac rebuilds them per arch (npmRebuild).
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: ${productName}-${arch}.${ext}
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: EduBoard stores your class data in a local database file.
    - NSDownloadsFolderUsageDescription: EduBoard can export reports and backups to your Downloads folder.
  # Hardened runtime is required for notarization. Actual signing/notarization only
  # happens when the relevant env vars are present (see docs/CODE_SIGNING.md). Without
  # a certificate the release workflow signs ad hoc instead (identity "-", no hardened
  # runtime): Apple Silicon Macs won't run an app with no signature at all.
  hardenedRuntime: true
dmg:
  artifactName: ${productName}-${arch}.${ext}
linux:
  target:
    - AppImage
  category: Education
  syncDesktopName: true
appImage:
  artifactName: ${productName}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: purysho
  repo: EduBoard
  releaseType: release
