<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="robots" content="noindex" />
<title>EduBoard Portal admin</title>
<style>
  :root { --primary: #6366f1; --primary-dark: #4f46e5; --ink: #0f172a; --muted: #64748b; --border: #e2e8f0; --bg: #f4f5fb; --danger: #b91c1c; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: var(--ink); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.hint { color: var(--muted); margin: 0 0 20px; font-size: .92rem; line-height: 1.5; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  .tile { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
  .tile-label { font-size: .75rem; color: var(--muted); }
  .tile-value { font-weight: 600; margin-top: 2px; }
  label { display: block; font-size: .8rem; font-weight: 600; margin: 0 0 6px; color: var(--muted); }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font: inherit; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row > div { flex: 1; }
  button { padding: 10px 16px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--primary-dark); }
  button:disabled { opacity: .6; cursor: default; }
  button.secondary { background: #fff; color: var(--ink); border: 1px solid var(--border); }
  button.danger { background: #fff; color: var(--danger); border: 1px solid #fecaca; padding: 6px 10px; font-size: .8rem; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .03em; }
  td.num { text-align: right; }
  .error { color: var(--danger); font-size: .88rem; min-height: 1.2em; }
  .secret { font-family: ui-monospace, Menlo, Consolas, monospace; background: #f8fafc; border: 1px dashed var(--border); border-radius: 8px; padding: 10px; word-break: break-all; margin: 8px 0; }
  .notice { background: #fef3c7; border: 1px solid #fde68a; }
  @media (max-width: 560px) { .row { flex-direction: column; align-items: stretch; } td.hide-sm, th.hide-sm { display: none; } }
</style>
</head>
<body>
<div class="wrap" id="app">Loading…</div>
<script>
// Portal admin: list, add and remove teachers. Talks only to /api/admin, authenticated
// by ADMIN_SECRET in a header. The secret lives in sessionStorage (this tab only,
// gone when it closes), never in the URL or in localStorage. Every value from the
// server is escaped before it touches the page.
const app = document.getElementById('app')
const SECRET_KEY = 'eduboard-admin-secret'

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
}

function getSecret() {
  try { return sessionStorage.getItem(SECRET_KEY) } catch { return null }
}
function setSecret(value) {
  try { value ? sessionStorage.setItem(SECRET_KEY, value) : sessionStorage.removeItem(SECRET_KEY) } catch { /* private mode */ }
}

async function adminApi(method, path, body, secret = getSecret()) {
  const res = await fetch('/api/admin' + path, {
    method,
    headers: { 'X-Admin-Secret': secret || '', ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined
  })
  const data = await res.json().catch(() => ({}))
  if (!res.ok) {
    const err = new Error(
      (data.error || `Request failed (${res.status})`) + (data.code ? ` (${data.code})` : '')
    )
    err.status = res.status
    throw err
  }
  return data
}

function renderSignIn(message) {
  app.innerHTML = `
    <h1>Portal admin</h1>
    <p class="hint">Add teachers to this Portal and see who is using it. Enter the Portal's <code>ADMIN_SECRET</code>.</p>
    <form class="card" id="signin">
      <label for="secret">Admin secret</label>
      <input id="secret" type="password" autocomplete="off" required />
      <p class="error" id="err">${esc(message || '')}</p>
      <button type="submit">Continue</button>
    </form>`
  document.getElementById('signin').onsubmit = async (e) => {
    e.preventDefault()
    const secret = document.getElementById('secret').value
    try {
      await adminApi('GET', '/teachers', null, secret)
      setSecret(secret)
      renderDashboard()
    } catch (err) {
      document.getElementById('err').textContent =
        err.status === 401 ? 'That secret is not right.' : err.message
    }
  }
}

async function renderDashboard(newTeacher) {
  let teachers
  try {
    teachers = await adminApi('GET', '/teachers')
  } catch (err) {
    setSecret(null)
    return renderSignIn(err.status === 401 ? 'Please sign in again.' : err.message)
  }
  app.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px">
      <h1>Portal admin</h1>
      <button class="secondary" id="signout">Sign out</button>
    </div>
    <p class="hint">Each teacher gets their own sync secret for the desktop app (Settings → Portal sync secret). They only ever see their own classes and students.</p>
    ${
      newTeacher
        ? `<div class="card notice" id="new-secret">
             <strong>Sync secret for ${esc(newTeacher.name)}</strong>
             <p class="hint" style="margin:4px 0 0">Copy it now and give it to them privately. It is shown only once; if it's lost, remove the teacher and add them again.</p>
             <div class="secret" id="secret-value">${esc(newTeacher.syncSecret)}</div>
             <button class="secondary" id="copy">Copy</button>
           </div>`
        : ''
    }
    <form class="card" id="add">
      <div class="row">
        <div>
          <label for="name">Add a teacher</label>
          <input id="name" placeholder="Full name" maxlength="100" required />
        </div>
        <button type="submit">Add teacher</button>
      </div>
      <p class="error" id="add-err"></p>
    </form>
    <div class="card">
      ${
        teachers.length
          ? `<table>
              <thead><tr><th>Teacher</th><th class="hide-sm">Added</th><th class="num">Classes</th><th class="num">Students</th><th></th></tr></thead>
              <tbody>
                ${teachers
                  .map(
                    (t) => `<tr>
                      <td>${esc(t.name)}</td>
                      <td class="hide-sm">${esc(new Date(t.createdAt).toLocaleDateString())}</td>
                      <td class="num">${Number(t.classCount) || 0}</td>
                      <td class="num">${Number(t.studentCount) || 0}</td>
                      <td class="num"><button class="danger" data-remove="${esc(t.id)}" data-name="${esc(t.name)}">Remove</button></td>
                    </tr>`
                  )
                  .join('')}
              </tbody>
            </table>`
          : '<p class="hint" style="margin:0">No teachers yet.</p>'
      }
    </div>
    <div class="card" id="branding"></div>
    <div class="card" id="adoption"></div>
    <div class="card" id="usage"></div>`

  renderBranding()
  renderAdoption()
  renderUsage()
  document.getElementById('signout').onclick = () => { setSecret(null); renderSignIn() }
  const copy = document.getElementById('copy')
  if (copy) {
    copy.onclick = async () => {
      try {
        await navigator.clipboard.writeText(newTeacher.syncSecret)
        copy.textContent = 'Copied'
      } catch {
        copy.textContent = 'Select the text above and copy it'
      }
    }
  }
  document.getElementById('add').onsubmit = async (e) => {
    e.preventDefault()
    const name = document.getElementById('name').value.trim()
    try {
      const created = await adminApi('POST', '/teachers', { name })
      renderDashboard(created)
    } catch (err) {
      document.getElementById('add-err').textContent = err.message
    }
  }
  app.querySelectorAll('[data-remove]').forEach((btn) => {
    btn.onclick = async () => {
      const ok = confirm(
        `Remove ${btn.dataset.name}? Their sync secret stops working immediately, and everything of theirs on this Portal is deleted: classes, grades, homework and submitted files, materials, and their students' profiles and accounts. This can't be undone. Their desktop app keeps all its own data.`
      )
      if (!ok) return
      await adminApi('DELETE', '/teachers/' + encodeURIComponent(btn.dataset.remove))
      renderDashboard()
    }
  })
}

// The name and logo families see (services/branding.js): what the teachers' apps agree
// on, one teacher's, or EduBoard's own.
async function renderBranding() {
  const box = document.getElementById('branding')
  let data
  try {
    data = await adminApi('GET', '/branding')
  } catch (err) {
    box.innerHTML = `<p class="error">${esc(err.message)}</p>`
    return
  }
  const shown = data.current.name || 'EduBoard Portal'
  const option = (value, label) =>
    `<label style="display:flex; gap:8px; align-items:center; margin:6px 0; font-weight:400">
       <input type="radio" name="brand-choice" value="${esc(value)}" ${data.choice === value ? 'checked' : ''} style="width:auto; margin:0" />
       <span>${label}</span>
     </label>`
  box.innerHTML = `
    <strong>Portal name and logo</strong>
    <p class="hint" style="margin:4px 0 8px">Families now see
      ${data.current.logo ? `<img src="${esc(data.current.logo)}" alt="" style="width:20px; height:20px; vertical-align:middle; border-radius:5px" />` : ''}
      <strong>${esc(shown)}</strong>. Each teacher's desktop app sends its own name and logo when it publishes (Settings → Portal and families).</p>
    ${option('auto', 'Automatic: the name all the teachers’ apps share (EduBoard if they differ)')}
    ${data.teachers
      .filter((t) => t.appName)
      .map((t) =>
        option(
          'teacher:' + t.id,
          `${esc(t.name)}’s app: <strong>${esc(t.appName)}</strong>${t.hasLogo ? ' with its logo' : ''}`
        )
      )
      .join('')}
    ${option('eduboard', 'EduBoard Portal')}
    <p class="error" id="brand-err"></p>`
  box.querySelectorAll('input[name="brand-choice"]').forEach((input) => {
    input.onchange = async () => {
      try {
        await adminApi('PUT', '/branding', { choice: input.value })
        renderBranding()
      } catch (err) {
        document.getElementById('brand-err').textContent = err.message
      }
    }
  })
}

// How much the Portal is used, from what it already stores for its own features.
async function renderAdoption() {
  const box = document.getElementById('adoption')
  let data
  try {
    data = await adminApi('GET', '/adoption?weeks=12')
  } catch {
    box.remove()
    return
  }
  const t = data.totals
  const pct = (v) => (v === null ? '—' : Math.round(v * 100) + '%')
  const recent = data.weeks.slice(-4)
  const avg = (key) => Math.round(recent.reduce((s, w) => s + w[key], 0) / recent.length)
  const tiles = [
    ['Teachers publishing', `${t.teachersPublishing} of ${t.teachers}`],
    ['Students with a login', `${t.studentsWithLogin} of ${t.students} (${pct(t.loginShare)})`],
    ['Families active a week', `${avg('families')} (last 4 weeks)`],
    ['Teachers active a week', `${avg('teachers')} (last 4 weeks)`],
    ['Report cards opened', t.reportCards ? `${pct(t.reportCardsOpenedShare)} of ${t.reportCards} sent to families with a login` : '—'],
    ['Notices answered', t.replySlipExpected ? pct(t.replySlipShare) : '—'],
    ['Class Story seen (30 days)', t.posts30 ? `${pct(t.postsSeenShare30)} of ${t.posts30} posts` : '—'],
    ['Work handed in (30 days)', String(t.handedIn30)],
    ['Logins that agreed to the terms', t.accounts ? pct(t.consentShare) : '—']
  ]
  const summary = [
    `EduBoard Portal usage, ${data.generatedAt.slice(0, 10)}`,
    ...tiles.map(([k, v]) => `${k}: ${v}`),
    '',
    'Week of: families active / teachers active',
    ...data.weeks.map((w) => `${w.week}: ${w.families} / ${w.teachers}`)
  ].join('\n')
  box.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px">
      <strong>How much the Portal is used</strong>
      <span style="display:flex; gap:8px">
        <button class="secondary" id="consent-csv">Consent records (CSV)</button>
        <button class="secondary" id="copy-adoption">Copy as text</button>
      </span>
    </div>
    <p class="hint" style="margin:4px 0 10px">Counted only from what the Portal already keeps for its features. A family is active in a week if they saw a Class Story post, opened a report card, answered a notice, sent a message, handed in work or used the Study Helper; a teacher if they posted, sent report cards, marked work or messaged a family. Just looking at grades isn't counted, so these are lower bounds.</p>
    <div class="tiles">${tiles.map(([k, v]) => `<div class="tile"><div class="tile-label">${esc(k)}</div><div class="tile-value">${esc(v)}</div></div>`).join('')}</div>
    <table style="margin-top:12px">
      <thead><tr><th>Week of</th><th class="num">Families active</th><th class="num">Teachers active</th></tr></thead>
      <tbody>${data.weeks
        .slice()
        .reverse()
        .map((w) => `<tr><td>${esc(w.week)}</td><td class="num">${w.families}</td><td class="num">${w.teachers}</td></tr>`)
        .join('')}</tbody>
    </table>`
  document.getElementById('consent-csv').onclick = async () => {
    const rows = await adminApi('GET', '/consents')
    const cell = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`
    const csv = [
      ['Username', 'Children', 'Signed up', 'Agreed at', 'Agreed by', 'Version'],
      ...rows.map((r) => [r.username, r.children, r.signedUp, r.agreedAt, r.agreedBy, r.version])
    ]
      .map((r) => r.map(cell).join(','))
      .join('\r\n')
    const a = document.createElement('a')
    a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }))
    a.download = `portal-consent-records-${new Date().toISOString().slice(0, 10)}.csv`
    a.click()
  }
  document.getElementById('copy-adoption').onclick = async (e) => {
    try {
      await navigator.clipboard.writeText(summary)
      e.target.textContent = 'Copied'
    } catch {
      e.target.textContent = 'Couldn’t copy'
    }
  }
}

// Anonymous desktop usage (only copies whose teacher turned on "Help improve EduBoard").
async function renderUsage() {
  const box = document.getElementById('usage')
  let data
  try {
    data = await adminApi('GET', '/usage?weeks=12')
  } catch {
    box.remove()
    return
  }
  const pct = (v) => (v === null ? '—' : Math.round(v * 100) + '%')
  const weeks = data.weeks.filter((w) => w.active || w.new)
  box.innerHTML = `
    <strong>Desktop apps in use</strong>
    <p class="hint" style="margin:4px 0 8px">Anonymous weekly pings from copies of EduBoard whose teacher turned on “Help improve EduBoard”. Retention is the share of copies first seen that week that were still in use 4 and 12 weeks later.</p>
    ${
      weeks.length
        ? `<table>
            <thead><tr><th>Week of</th><th class="num">Active</th><th class="num">New</th><th class="num">After 4 wks</th><th class="num">After 12 wks</th></tr></thead>
            <tbody>${weeks
              .reverse()
              .map(
                (w) => `<tr><td>${esc(w.week)}</td><td class="num">${w.active}</td><td class="num">${w.new}</td><td class="num">${pct(w.week4)}</td><td class="num">${pct(w.week12)}</td></tr>`
              )
              .join('')}</tbody>
          </table>`
        : '<p class="hint" style="margin:0">No pings yet.</p>'
    }`
}

getSecret() ? renderDashboard() : renderSignIn()
</script>
</body>
</html>
