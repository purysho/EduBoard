<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EduBoard Portal</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon.svg" />
<meta name="theme-color" content="#6366f1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --ink: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --bg: #f4f5fb;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--ink); }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 16px 20px; background: #fff; border-bottom: 1px solid var(--border); }
  .badge { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .8rem; }
  .brand { font-weight: 700; font-size: 1rem; letter-spacing: -.01em; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 40px 20px 60px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -.01em; }
  p.hint { color: var(--muted); margin: 0 0 24px; font-size: .92rem; line-height: 1.5; }
  label { display: block; font-size: .82rem; font-weight: 600; margin: 16px 0 6px; color: #334155; }
  input, select { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; font: inherit; font-size: .92rem; background: #fff; transition: border-color .15s; }
  input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgb(99 102 241 / .12); }
  button { width: 100%; margin-top: 22px; padding: 13px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font: inherit; font-weight: 600; font-size: .92rem; cursor: pointer; transition: background .15s; }
  button:hover:not(:disabled) { background: var(--primary-dark); }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { background: #fff; color: var(--ink); border: 1px solid var(--border); }
  button.secondary:hover:not(:disabled) { background: #f8fafc; }
  .error { color: #dc2626; font-size: .85rem; margin-top: 10px; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 2px rgb(15 23 42 / .04); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .muted { color: var(--muted); font-size: .85rem; }
  .desc { color: #475569; font-size: .87rem; line-height: 1.5; margin: 8px 0 0; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
  .pill.not_started { background: #f1f5f9; color: #64748b; }
  .pill.submitted { background: #fef3c7; color: #92400e; }
  .pill.done { background: #d1fae5; color: #065f46; }
  img.qr { width: 180px; height: 180px; display: block; margin: 14px auto; border-radius: 10px; }
  a.linklike { color: var(--primary); text-decoration: none; font-size: .85rem; font-weight: 600; }
  a.linklike:hover { text-decoration: underline; }
  .dob-row { display: grid; grid-template-columns: 2fr 1fr 1.2fr; gap: 8px; }
  .dob-row select { width: 100%; box-sizing: border-box; padding: 11px; border: 1px solid var(--border); border-radius: 10px; font: inherit; background: #fff; }
  .field-note { color: var(--muted); font-size: .8rem; margin: 6px 0 0; line-height: 1.4; }
  .section-title { font-size: 1.1rem; font-weight: 700; margin: 28px 0 12px; letter-spacing: -.01em; }
  .section-title:first-child { margin-top: 0; }
  #messages, .ai-chat { max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .msg { display: flex; flex-direction: column; max-width: 80%; }
  .msg.family { align-self: flex-end; align-items: flex-end; }
  .msg.teacher { align-self: flex-start; align-items: flex-start; }
  .msg-bubble { padding: 8px 12px; border-radius: 12px; font-size: .88rem; line-height: 1.4; white-space: pre-wrap; }
  .msg.family .msg-bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
  .msg.teacher .msg-bubble { background: #f1f5f9; color: var(--ink); border-bottom-left-radius: 4px; }
  .notif-pill { display: inline-block; margin-bottom: 12px; padding: 7px 14px; border-radius: 999px; background: var(--primary); color: #fff; font-size: .85rem; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<div class="topbar"><div class="badge">EB</div><div class="brand">EduBoard Portal</div></div>
<div class="wrap" id="app">Loading…</div>
<script>
const app = document.getElementById('app')
const params = new URLSearchParams(location.search)

// Offline-first data cache — deliberately separate from the service worker (see
// service-worker.js), so this page-level code can tell "served fresh" from "served
// from cache" and show an honest last-synced banner rather than silently serving stale
// data. Only GET requests are cached; every write (submit homework, send a message,
// etc.) always requires a live connection.
const API_CACHE = 'eduboard-api-v1'
const LAST_SYNCED_KEY = 'eduboard-last-synced'
let servedFromCache = false

async function api(path, opts) {
  const isGet = !opts?.method || opts.method === 'GET'
  const req = '/api' + path

  try {
    const res = await fetch(req, {
      method: opts?.method || 'GET',
      headers: opts?.body ? { 'Content-Type': 'application/json' } : undefined,
      body: opts?.body ? JSON.stringify(opts.body) : undefined
    })
    const data = await res.json().catch(() => ({}))
    if (!res.ok) throw new Error(data.error || 'Something went wrong')
    servedFromCache = false
    if (isGet && 'caches' in window) {
      caches.open(API_CACHE).then((cache) =>
        cache.put(
          req,
          new Response(JSON.stringify(data), { headers: { 'Content-Type': 'application/json' } })
        )
      )
      localStorage.setItem(LAST_SYNCED_KEY, new Date().toISOString())
    }
    return data
  } catch (err) {
    if (isGet && 'caches' in window) {
      const cached = await caches.match(req)
      if (cached) {
        servedFromCache = true
        return cached.json()
      }
    }
    throw err
  }
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
}

// Polls the cheap /me/notifications endpoint while the dashboard is open, so a family
// sees "N new messages" without needing real push infrastructure — good enough for a
// tab left open, and the count is also reflected in the browser tab title so it's
// visible even when the Portal isn't the focused tab.
let notificationPollTimer = null
const BASE_TITLE = document.title

function startNotificationPolling() {
  if (notificationPollTimer) return
  updateNotificationBadge()
  notificationPollTimer = setInterval(updateNotificationBadge, 20000)
}

async function updateNotificationBadge() {
  const el = document.getElementById('notif-badge')
  if (!el) return
  let unread = 0
  try {
    ;({ unreadMessages: unread } = await api('/me/notifications'))
  } catch {
    return
  }
  document.title = unread > 0 ? `(${unread}) ${BASE_TITLE}` : BASE_TITLE
  el.innerHTML =
    unread > 0
      ? `<a href="#messages-section" class="notif-pill">${unread} new message${unread === 1 ? '' : 's'} from your teacher</a>`
      : ''
}

function lastSyncedLabel() {
  const iso = localStorage.getItem(LAST_SYNCED_KEY)
  if (!iso) return 'unknown'
  return new Date(iso).toLocaleString(undefined, {
    month: 'short',
    day: 'numeric',
    hour: 'numeric',
    minute: '2-digit'
  })
}

function offlineBannerHtml() {
  if (!servedFromCache) return ''
  return `<div class="card" style="background:#fef3c7; margin-bottom:12px">
    <strong>Viewing saved data</strong>
    <p class="muted" style="margin:4px 0 0">You're offline — last synced ${lastSyncedLabel()}. Reconnect to see the latest.</p>
  </div>`
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(() => {})
  })
}

async function main() {
  const code = params.get('code')
  if (code) return renderRedeem(code)

  try {
    const me = await api('/me')
    renderDashboard(me)
    startNotificationPolling()
  } catch {
    // A thrown fetch (not an auth rejection) with nothing cached yet and no connection
    // is a genuinely different situation from "not logged in" — don't send someone
    // straight to a login form that can't succeed offline anyway.
    if (!navigator.onLine) {
      app.innerHTML = `
        <h1>You're offline</h1>
        <p class="hint">Nothing saved on this device yet. Connect once to load your dashboard — after that, it stays available offline.</p>
        <button onclick="location.reload()">Try again</button>
      `
      return
    }
    renderLogin()
  }
}

function renderLogin() {
  app.innerHTML = `
    <h1>Welcome back</h1>
    <p class="hint">Sign in to see grades, attendance, and homework.</p>
    <label>Username</label>
    <input id="u" autocomplete="username" />
    <label>Password</label>
    <input id="p" type="password" autocomplete="current-password" />
    <button id="go">Log in</button>
    <p class="error" id="err"></p>
  `
  document.getElementById('go').onclick = async () => {
    try {
      await api('/auth/login', { method: 'POST', body: { username: document.getElementById('u').value, password: document.getElementById('p').value } })
      location.reload()
    } catch (e) {
      document.getElementById('err').textContent = e.message
    }
  }
}

const MONTHS = [
  'January', 'February', 'March', 'April', 'May', 'June',
  'July', 'August', 'September', 'October', 'November', 'December'
]

function dobPickerHtml() {
  const thisYear = new Date().getFullYear()
  const months = MONTHS.map((m, i) => `<option value="${String(i + 1).padStart(2, '0')}">${m}</option>`).join('')
  const days = Array.from({ length: 31 }, (_, i) => i + 1)
    .map((d) => `<option value="${String(d).padStart(2, '0')}">${d}</option>`).join('')
  const years = Array.from({ length: 100 }, (_, i) => thisYear - i)
    .map((y) => `<option value="${y}">${y}</option>`).join('')
  return `
    <div class="dob-row">
      <select id="dob-m"><option value="">Month</option>${months}</select>
      <select id="dob-d"><option value="">Day</option>${days}</select>
      <select id="dob-y"><option value="">Year</option>${years}</select>
    </div>
  `
}

function readDob() {
  const m = document.getElementById('dob-m').value
  const d = document.getElementById('dob-d').value
  const y = document.getElementById('dob-y').value
  if (!m || !d || !y) return ''
  return `${y}-${m}-${d}`
}

async function renderRedeem(code) {
  app.innerHTML = 'Loading…'
  let info
  try {
    info = await api('/invites/' + encodeURIComponent(code))
  } catch (e) {
    app.innerHTML = `<h1>Can't join</h1><p class="error">${e.message}</p>`
    return
  }
  const studentsById = Object.fromEntries(info.students.map((s) => [s.id, s]))
  app.innerHTML = `
    <h1>Join ${info.className}</h1>
    <p class="hint">Pick your name, confirm your date of birth, and set a login.</p>
    <label>Student</label>
    <select id="sid">${info.students.map((s) => `<option value="${s.id}">${s.name}</option>`).join('')}</select>
    <label>Date of birth</label>
    ${dobPickerHtml()}
    <p class="field-note" id="dob-note"></p>
    <label>Username</label>
    <input id="u" autocomplete="username" />
    <label>Password</label>
    <input id="p" type="password" autocomplete="new-password" />
    <button id="go">Create account</button>
    <p class="error" id="err"></p>
  `
  function updateDobNote() {
    const selected = studentsById[document.getElementById('sid').value]
    document.getElementById('dob-note').textContent = selected?.hasDob
      ? "This confirms it's really you — must match what your teacher has on file."
      : 'Your teacher hasn’t recorded this yet — enter it now so it’s on file for next time.'
  }
  document.getElementById('sid').onchange = updateDobNote
  updateDobNote()

  document.getElementById('go').onclick = async () => {
    try {
      await api('/invites/' + encodeURIComponent(code) + '/redeem', {
        method: 'POST',
        body: {
          studentId: document.getElementById('sid').value,
          dateOfBirth: readDob(),
          username: document.getElementById('u').value,
          password: document.getElementById('p').value
        }
      })
      location.href = '/'
    } catch (e) {
      document.getElementById('err').textContent = e.message
    }
  }
}

function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader()
    reader.onload = () => resolve(reader.result.split(',')[1])
    reader.onerror = reject
    reader.readAsDataURL(file)
  })
}

function homeworkByTopicHtml(homework, studentId) {
  const groups = new Map()
  for (const h of homework) {
    const key = (h.topic || '').trim() || 'Other'
    if (!groups.has(key)) groups.set(key, [])
    groups.get(key).push(h)
  }
  const entries = [...groups.entries()].sort((a, b) =>
    a[0] === 'Other' ? 1 : b[0] === 'Other' ? -1 : 0
  )
  return entries
    .map(
      ([topic, items]) => `
      <p class="muted" style="margin:14px 0 4px; font-weight:600; text-transform:uppercase; font-size:.75rem; letter-spacing:.03em">${topic}</p>
      ${items.map((h) => homeworkCardHtml(h, studentId)).join('')}`
    )
    .join('')
}

function quickCheckHtml(h, studentId) {
  if (!h.questions || !h.questions.length) return ''
  const answered = h.questions.every((q) => q.yourAnswer !== null)
  if (answered) {
    const correctCount = h.questions.filter((q) => q.wasCorrect).length
    return `
      <div class="card" style="margin-top:12px; background:#f8fafc">
        <p class="muted" style="margin:0 0 8px">Quick check — ${correctCount}/${h.questions.length} correct</p>
        ${h.questions
          .map(
            (q) => `
          <p class="desc" style="margin:6px 0">
            ${q.wasCorrect ? '✅' : '❌'} ${q.prompt}
          </p>`
          )
          .join('')}
      </div>`
  }
  return `
    <form data-quiz="${h.id}" data-student="${studentId}" style="margin-top:12px" class="card">
      <p class="muted" style="margin:0 0 8px">Quick check</p>
      ${h.questions
        .map(
          (q, i) => `
        <div style="margin-bottom:12px">
          <p style="margin:0 0 6px; font-weight:600">${i + 1}. ${q.prompt}</p>
          ${
            q.type === 'multiple_choice'
              ? (q.options || [])
                  .map(
                    (opt, oi) => `
              <label style="display:flex; align-items:center; gap:8px; margin:4px 0">
                <input type="radio" name="q-${q.id}" value="${oi}" required />
                ${opt}
              </label>`
                  )
                  .join('')
              : `<input type="text" name="q-${q.id}" style="width:100%; box-sizing:border-box; padding:9px; border:1px solid var(--border); border-radius:8px; font:inherit;" required />`
          }
        </div>`
        )
        .join('')}
      <button type="submit">Submit answers</button>
      <p class="error"></p>
    </form>`
}

function homeworkCardHtml(h, studentId) {
  const graded = h.status === 'done'
  const detailId = `${h.id}-${studentId}`
  return `
    <div class="card">
      <div class="row" data-toggle="${detailId}" style="cursor:pointer">
        <strong>${h.title}</strong>
        <span class="pill ${h.status}">${h.status.replace('_', ' ')}</span>
      </div>
      ${h.dueDate ? `<p class="muted" style="margin:4px 0 0">Due ${h.dueDate}</p>` : ''}
      <div id="detail-${detailId}" style="display:none; margin-top:10px">
        ${h.description ? `<p class="desc">${h.description}</p>` : ''}
        ${h.fileName ? `<p style="margin-top:8px"><a class="linklike" href="/api/me/homework/${h.id}/file">\u{1F4CE} ${h.fileName} (from your teacher)</a></p>` : ''}
        ${quickCheckHtml(h, studentId)}
        ${
          graded
            ? `
          <div class="card" style="margin-top:12px; background:#f8fafc">
            <p class="muted" style="margin:0">Your submission</p>
            ${h.textAnswer ? `<p class="desc">${h.textAnswer}</p>` : ''}
            ${h.submissionFileName ? `<p style="margin-top:6px"><a class="linklike" href="/api/me/homework/${h.id}/submission-file?studentId=${studentId}">\u{1F4CE} ${h.submissionFileName}</a></p>` : ''}
            ${h.grade ? `<p style="margin-top:10px"><strong>Grade: ${h.grade}</strong></p>` : ''}
            ${h.feedback ? `<p class="desc"><strong>Feedback:</strong> ${h.feedback}</p>` : ''}
          </div>`
            : `
          <form data-submit="${h.id}" data-student="${studentId}" style="margin-top:10px">
            ${
              h.status === 'submitted'
                ? `<p class="field-note">Already turned in${h.submissionFileName ? ` — attached ${h.submissionFileName}` : ''}. Submitting again replaces it.</p>`
                : ''
            }
            <label>Your answer</label>
            <textarea data-answer rows="3" style="width:100%; box-sizing:border-box; padding:11px; border:1px solid var(--border); border-radius:10px; font:inherit;">${h.textAnswer || ''}</textarea>
            <label>Attach a file</label>
            <input data-file type="file" />
            <button type="submit">${h.status === 'submitted' ? 'Update submission' : 'Turn in'}</button>
            <p class="error"></p>
          </form>`
        }
      </div>
    </div>`
}

let lastLoadedMessages = []

async function loadMessages() {
  const box = document.getElementById('messages')
  if (!box) return
  const messages = await api('/me/messages')
  lastLoadedMessages = messages
  renderMessages(messages)
  box.scrollTop = box.scrollHeight
  updateNotificationBadge()
}

function renderMessages(messages) {
  const box = document.getElementById('messages')
  if (!box) return
  box.innerHTML = !messages.length
    ? '<p class="muted">No messages yet — say hello below.</p>'
    : messages
        .map(
          (m) => `
      <div class="msg ${m.sender}">
        <div class="msg-bubble" data-msg-body="${m.id}">${esc(m.translatedBody ?? m.body)}</div>
        <div class="muted" style="font-size:.72rem; margin-top:2px; display:flex; gap:8px; align-items:center">
          <span>${formatWhen(m.createdAt)}</span>
          <a href="#" data-translate="${m.id}" style="font-size:.72rem">${m.translatedBody ? 'Show original' : 'Translate'}</a>
        </div>
      </div>`
        )
        .join('')
  box.querySelectorAll('[data-translate]').forEach((link) => {
    link.addEventListener('click', async (e) => {
      e.preventDefault()
      const id = link.getAttribute('data-translate')
      const message = lastLoadedMessages.find((m) => m.id === id)
      if (!message) return
      if (message.translatedBody) {
        message.translatedBody = null
        renderMessages(lastLoadedMessages)
        return
      }
      link.textContent = 'Translating…'
      try {
        const targetLang = document.getElementById('msg-lang')?.value || 'English'
        const { translatedBody } = await api(`/me/messages/${id}/translate`, {
          method: 'POST',
          body: { targetLang }
        })
        message.translatedBody = translatedBody
        renderMessages(lastLoadedMessages)
      } catch (err) {
        link.textContent = 'Translate'
        alert(err.message || 'Translation failed. Try again in a moment.')
      }
    })
  })
}

async function loadPortfolio() {
  const box = document.getElementById('portfolio')
  if (!box) return
  const items = await api('/me/portfolio')
  if (!items.length) {
    box.parentElement.style.display = 'none'
    return
  }
  box.parentElement.style.display = ''
  box.innerHTML = items
    .map(
      (p) => `
    <div class="card">
      <div class="row"><strong>${p.title}</strong><span class="muted">${p.gradedAt ? formatWhen(p.gradedAt) : ''}</span></div>
      <p class="muted" style="margin:2px 0 6px">${p.studentName} · ${p.className}${p.topic ? ' · ' + p.topic : ''}</p>
      ${p.grade ? `<p class="desc"><strong>Grade:</strong> ${p.grade}</p>` : ''}
      ${p.feedback ? `<p class="desc">${p.feedback}</p>` : ''}
    </div>`
    )
    .join('')
}

// Reads text aloud with the browser's own built-in speech synthesis — free, no server
// TTS cost or API key, and works offline once the page is loaded. Quality varies by
// device/OS voice, but it's a real "audio overview" with zero added infrastructure.
let currentUtterance = null
function speak(text, buttonEl) {
  if (!('speechSynthesis' in window)) {
    alert('Audio isn’t supported in this browser.')
    return
  }
  if (currentUtterance) {
    window.speechSynthesis.cancel()
    currentUtterance = null
    if (buttonEl) buttonEl.textContent = '🔊 Listen'
    return
  }
  const utter = new SpeechSynthesisUtterance(text)
  utter.rate = 0.95
  utter.onend = () => {
    currentUtterance = null
    if (buttonEl) buttonEl.textContent = '🔊 Listen'
  }
  currentUtterance = utter
  if (buttonEl) buttonEl.textContent = '⏹ Stop'
  window.speechSynthesis.speak(utter)
}

async function loadMaterials() {
  const box = document.getElementById('materials')
  if (!box) return
  const items = await api('/me/materials')
  if (!items.length) {
    box.parentElement.style.display = 'none'
    return
  }
  box.parentElement.style.display = ''
  box.innerHTML = items
    .map((m, i) => {
      const guideId = `guide-${i}`
      return `
    <div class="card">
      <div class="row"><strong>${m.title}</strong><span class="muted">${m.className}</span></div>
      ${
        m.studyGuide
          ? `<div style="margin-top:8px">
               <button class="secondary" data-toggle="${guideId}">Show study guide</button>
               <button class="secondary" data-listen="${guideId}">🔊 Listen</button>
               <div id="detail-${guideId}" class="desc" style="display:none; margin-top:8px; white-space:pre-wrap">${m.studyGuide}</div>
             </div>`
          : '<p class="muted" style="margin-top:6px">No study guide yet for this one.</p>'
      }
    </div>`
    })
    .join('')

  box.querySelectorAll('[data-toggle]').forEach((el) => {
    el.onclick = () => {
      const detail = document.getElementById('detail-' + el.dataset.toggle)
      detail.style.display = detail.style.display === 'none' ? 'block' : 'none'
    }
  })
  box.querySelectorAll('[data-listen]').forEach((el) => {
    el.onclick = () => {
      const detail = document.getElementById('detail-' + el.dataset.listen)
      speak(detail.textContent, el)
    }
  })
}

function formatWhen(iso) {
  const d = new Date(iso)
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
}

async function loadClassStory() {
  const box = document.getElementById('story')
  if (!box) return
  const posts = await api('/me/posts')
  box.innerHTML = !posts.length
    ? '<p class="muted">No updates yet.</p>'
    : posts
        .map(
          (p) => `
      <div class="card">
        <div class="row"><strong>${p.className}</strong><span class="muted">${formatWhen(p.createdAt)}</span></div>
        <p class="desc">${p.body}</p>
        ${p.hasImage ? `<img src="/api/me/posts/${p.id}/image" style="width:100%; border-radius:10px; margin-top:8px" />` : ''}
      </div>`
        )
        .join('')
}

function renderDashboard(me) {
  if (!me.students.length) {
    app.innerHTML = `<h1>Welcome</h1><p class="hint">No student linked to this account yet.</p>`
    return
  }
  app.innerHTML =
    offlineBannerHtml() +
    `<div id="notif-badge"></div>
     <h1>Welcome back</h1>
     <div class="section-title">Class Story</div>
     <div id="story">Loading…</div>
     <div style="display:none">
       <div class="section-title">Portfolio</div>
       <div id="portfolio"></div>
     </div>
     <div style="display:none">
       <div class="section-title">Materials</div>
       <div id="materials"></div>
     </div>` +
    me.students
      .map(
        (s) => `
    <h1>${s.studentName}</h1>
    ${s.classes
      .map(
        (c) => `
      <div class="section-title">${c.name}</div>
      <div class="card">
        <div class="row"><strong>Grade</strong><span class="muted">${c.percent != null ? Math.round(c.percent) + '% (' + (c.letter ?? '') + ')' : 'No grade yet'}</span></div>
        <div class="row" style="margin-top:6px"><strong>Attendance</strong><span class="muted">${c.attendanceRate != null ? Math.round(c.attendanceRate * 100) + '%' : '—'}</span></div>
      </div>
        ${c.homework ? homeworkByTopicHtml(c.homework, s.studentId) : ''}`
      )
      .join('')
  }
    <div class="section-title">Study Helper</div>
    <div class="card">
      <div id="ai-chat-${s.studentId}" class="ai-chat"></div>
      <form data-ai-chat="${s.studentId}" style="margin-top:10px">
        <textarea rows="2" placeholder="Ask about your homework or a topic you're stuck on…" style="width:100%; box-sizing:border-box; padding:11px; border:1px solid var(--border); border-radius:10px; font:inherit;"></textarea>
        <button type="submit">Ask</button>
        <p class="error"></p>
      </form>
    </div>`
      )
      .join('') +
    `<div class="section-title" id="messages-section">Messages</div>
     <div class="card">
       <div style="display:flex; justify-content:flex-end; margin-bottom:6px">
         <select id="msg-lang" style="font-size:.75rem; padding:2px 4px">
           <option value="English">Translate into English</option>
           <option value="Chinese">Translate into Chinese (中文)</option>
           <option value="Spanish">Translate into Spanish</option>
           <option value="French">Translate into French</option>
         </select>
       </div>
       <div id="messages">Loading…</div>
       <form id="msg-form" style="margin-top:10px">
         <textarea id="msg-body" rows="2" placeholder="Message the teacher…" style="width:100%; box-sizing:border-box; padding:11px; border:1px solid var(--border); border-radius:10px; font:inherit;"></textarea>
         <button type="submit">Send</button>
       </form>
     </div>
     <div class="section-title">Email updates</div>
     <div class="card">
       <p class="muted" style="margin:0 0 8px">Get a weekly summary emailed to you — grades, attendance, what's due, and any class updates.</p>
       <form id="email-form" style="display:flex; gap:8px">
         <input id="email-input" type="email" placeholder="you@example.com" style="flex:1; box-sizing:border-box; padding:10px; border:1px solid var(--border); border-radius:10px; font:inherit" />
         <button type="submit">Save</button>
       </form>
       <p id="email-status" class="muted" style="margin:6px 0 0; font-size:.8rem"></p>
     </div>
     <button class="secondary" id="qr">Get quick-login QR</button>
     <button class="secondary" id="logout">Log out</button>
     <div id="qrbox"></div>`

  document.querySelectorAll('[data-toggle]').forEach((el) => {
    el.onclick = () => {
      const detail = document.getElementById('detail-' + el.dataset.toggle)
      detail.style.display = detail.style.display === 'none' ? 'block' : 'none'
    }
  })

  document.querySelectorAll('[data-submit]').forEach((form) => {
    form.onsubmit = async (e) => {
      e.preventDefault()
      const hwId = form.dataset.submit
      const studentId = form.dataset.student
      const textAnswer = form.querySelector('[data-answer]').value
      const fileInput = form.querySelector('[data-file]')
      const file = fileInput.files[0]
      const err = form.querySelector('.error')
      err.textContent = ''

      try {
        const fileData = file ? await readFileAsBase64(file) : null
        await api(`/me/homework/${hwId}/submit`, {
          method: 'POST',
          body: { studentId, textAnswer, fileName: file?.name || null, fileData }
        })
        location.reload()
      } catch (ex) {
        err.textContent = ex.message
      }
    }
  })

  document.querySelectorAll('[data-quiz]').forEach((form) => {
    form.onsubmit = async (e) => {
      e.preventDefault()
      const hwId = form.dataset.quiz
      const studentId = form.dataset.student
      const err = form.querySelector('.error')
      err.textContent = ''

      const answers = {}
      form.querySelectorAll('[name^="q-"]').forEach((el) => {
        if (el.type === 'radio' && !el.checked) return
        answers[el.name.slice(2)] = el.value
      })

      try {
        await api(`/me/homework/${hwId}/answers`, { method: 'POST', body: { studentId, answers } })
        location.reload()
      } catch (ex) {
        err.textContent = ex.message
      }
    }
  })

  document.querySelectorAll('[data-ai-chat]').forEach((form) => {
    form.onsubmit = async (e) => {
      e.preventDefault()
      const studentId = form.dataset.aiChat
      const textarea = form.querySelector('textarea')
      const err = form.querySelector('.error')
      const message = textarea.value.trim()
      if (!message) return
      err.textContent = ''
      const box = document.getElementById('ai-chat-' + studentId)
      box.insertAdjacentHTML('beforeend', `<div class="msg family"><div class="msg-bubble">${message}</div></div>`)
      textarea.value = ''
      const thinking = document.createElement('div')
      thinking.className = 'msg teacher'
      thinking.innerHTML = '<div class="msg-bubble muted">Thinking…</div>'
      box.appendChild(thinking)
      box.scrollTop = box.scrollHeight
      try {
        const { reply, citations } = await api('/me/ai/chat', {
          method: 'POST',
          body: { studentId, message }
        })
        const citeHtml = citations && citations.length
          ? `<div class="muted" style="font-size:.76rem; margin-top:4px">Sources: ${citations
              .map((c) => `[${c.number}] ${c.title}`)
              .join(' · ')}</div>`
          : ''
        thinking.innerHTML = `<div class="msg-bubble">${reply}</div>${citeHtml}<button class="secondary" style="margin-top:4px; padding:2px 8px; font-size:.76rem" data-listen-reply>🔊</button>`
        thinking.querySelector('[data-listen-reply]').onclick = (evt) => speak(reply, evt.target)
      } catch (ex) {
        thinking.remove()
        err.textContent = ex.message
      }
      box.scrollTop = box.scrollHeight
    }
  })

  loadClassStory()
  loadPortfolio()
  loadMaterials()
  loadMessages()
  document.getElementById('msg-form').onsubmit = async (e) => {
    e.preventDefault()
    const input = document.getElementById('msg-body')
    if (!input.value.trim()) return
    await api('/me/messages', { method: 'POST', body: { body: input.value.trim() } })
    input.value = ''
    loadMessages()
  }

  api('/me/account').then((acc) => {
    document.getElementById('email-input').value = acc.email || ''
  })
  document.getElementById('email-form').onsubmit = async (e) => {
    e.preventDefault()
    const status = document.getElementById('email-status')
    status.textContent = 'Saving…'
    try {
      await api('/me/account', {
        method: 'POST',
        body: { email: document.getElementById('email-input').value.trim() }
      })
      status.textContent = 'Saved.'
    } catch (ex) {
      status.textContent = ex.message
    }
  }

  document.getElementById('qr').onclick = async () => {
    const { qrDataUrl } = await api('/me/qr', { method: 'POST' })
    document.getElementById('qrbox').innerHTML = `
      <img class="qr" src="${qrDataUrl}" />
      <p class="muted" style="text-align:center">Save this image — opening it logs you in with one tap, no typing.</p>
      <a class="linklike" href="${qrDataUrl}" download="eduboard-login.png">Download</a>
    `
  }
  document.getElementById('logout').onclick = async () => {
    await api('/auth/logout', { method: 'POST' })
    location.reload()
  }
}

main()
</script>
</body>
</html>
