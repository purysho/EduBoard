<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>EduBoard Portal</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon.svg" />
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />
<!-- Added to an iPhone home screen, the Portal opens full-screen like an app. -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="EduBoard" />
<!-- No web fonts: Google Fonts is blocked in mainland China, and a render-blocking
     stylesheet that never loads leaves students staring at a blank page. System fonts
     look native on every device and cost nothing to load. -->
<style>
  /* Same design tokens as the teacher's desktop app (src/renderer/src/assets/styles.css),
     so the two feel like one product. Dark mode follows the device setting. */
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface-muted: #f1f5f9;
    --border: #e2e8f0;
    --ink: #0f172a;
    --ink-soft: #334155;
    --muted: #64748b;
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --primary-soft: #eef2ff;
    --primary-line: #c7d2fe;
    --on-primary: #ffffff;
    --success: #15803d;
    --success-soft: #dcfce7;
    --warning: #b45309;
    --warning-soft: #fef3c7;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --late: #9a3412;
    --late-soft: #ffedd5;
    --ai: #6d28d9;
    --ai-soft: #ede9fe;
    --shadow: 0 1px 2px rgb(15 23 42 / .05), 0 1px 3px rgb(15 23 42 / .04);
    --sidebar-w: 248px;
    --bottom-nav-h: 64px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1120;
      --surface: #111827;
      --surface-muted: #1a2332;
      --border: #263042;
      --ink: #e5e7eb;
      --ink-soft: #cbd5e1;
      --muted: #94a3b8;
      --primary: #818cf8;
      --primary-dark: #6366f1;
      --primary-soft: #1e1b4b;
      --primary-line: #3730a3;
      --on-primary: #0b1120;
      --success: #4ade80;
      --success-soft: #14532d;
      --warning: #fbbf24;
      --warning-soft: #451a03;
      --danger: #f87171;
      --danger-soft: #450a0a;
      --late: #fdba74;
      --late-soft: #431407;
      --ai: #c4b5fd;
      --ai-soft: #2e1065;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans', sans-serif; margin: 0; background: var(--bg); color: var(--ink); -webkit-tap-highlight-color: transparent; }

  /* ---- Sign-in screens: brand bar and one centred card -------------------------------- */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
  body.app-mode .topbar { display: none; }
  .badge { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .8rem; flex-shrink: 0; }
  .brand { font-weight: 700; font-size: 1rem; letter-spacing: -.01em; }
  .wrap { max-width: 480px; margin: 32px auto; padding: 28px 24px 32px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); }
  @media (max-width: 560px) { .wrap { margin: 0; border: none; border-radius: 0; min-height: calc(100vh - 61px); } }
  body.app-mode .wrap { all: unset; display: block; }

  /* ---- App shell: sidebar on wide screens, app bar + bottom tabs on phones ------------- */
  .shell { min-height: 100vh; }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w); display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--border); padding: 18px 12px; z-index: 20; }
  .side-brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
  .side-nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item { display: flex; align-items: center; gap: 12px; width: 100%; margin: 0; padding: 10px 12px; background: transparent; color: var(--muted); border-radius: 10px; font-size: .92rem; font-weight: 600; text-align: left; position: relative; }
  .nav-item:hover:not(:disabled) { background: var(--surface-muted); color: var(--ink); }
  .nav-item[aria-current="page"] { background: var(--primary-soft); color: var(--primary); }
  .nav-item[aria-current="page"]::before { content: ''; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--primary); }
  .nav-item svg, .bottom-item svg, .icon-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
  .nav-item .count { margin-left: auto; }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--border); }
  .user-chip { display: flex; align-items: center; gap: 10px; width: 100%; margin: 0; padding: 8px; background: transparent; color: var(--ink); border-radius: 10px; text-align: left; font-weight: 600; font-size: .88rem; }
  .user-chip:hover:not(:disabled) { background: var(--surface-muted); }
  .user-chip .avatar-sm { width: 32px; height: 32px; }
  .main { margin-left: var(--sidebar-w); }
  .content { max-width: 760px; margin: 0 auto; padding: 32px 24px 64px; }
  .appbar, .bottom-nav { display: none; }

  @media (max-width: 860px) {
    .sidebar { display: none; }
    .main { margin-left: 0; }
    .content { padding: 16px 16px calc(var(--bottom-nav-h) + var(--safe-bottom) + 24px); }
    .appbar { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 20; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(1.6) blur(12px); -webkit-backdrop-filter: saturate(1.6) blur(12px); border-bottom: 1px solid var(--border); }
    .appbar .brand { flex: 1; }
    .bottom-nav { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: calc(var(--bottom-nav-h) + var(--safe-bottom)); padding-bottom: var(--safe-bottom); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: saturate(1.6) blur(12px); -webkit-backdrop-filter: saturate(1.6) blur(12px); border-top: 1px solid var(--border); }
  }
  .bottom-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 100%; margin: 0; padding: 6px 2px; background: transparent; color: var(--muted); border-radius: 0; font-size: .7rem; font-weight: 600; position: relative; }
  .bottom-item:hover:not(:disabled) { background: transparent; color: var(--ink); }
  .bottom-item[aria-current="page"] { color: var(--primary); }
  .bottom-item .count { position: absolute; top: 4px; left: calc(50% + 6px); }
  button.icon-btn { width: 38px; height: 38px; margin: 0; padding: 0; display: inline-flex; align-items: center; justify-content: center; background: transparent; color: var(--ink); border-radius: 50%; }
  button.icon-btn:hover:not(:disabled) { background: var(--surface-muted); }
  .count { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--danger); color: #fff; font-size: .68rem; font-weight: 700; }
  .count[hidden] { display: none; }

  .panel { animation: panel-in .18s ease-out; }
  @keyframes panel-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .panel { animation: none; } }
  .page-head { margin-bottom: 20px; }
  .page-head h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -.02em; }
  .page-head p { margin: 0; color: var(--muted); font-size: .92rem; }

  /* ---- Building blocks ----------------------------------------------------------------- */
  h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -.01em; }
  p.hint { color: var(--muted); margin: 0 0 24px; font-size: .92rem; line-height: 1.5; }
  label { display: block; font-size: .82rem; font-weight: 600; margin: 16px 0 6px; color: var(--ink-soft); }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; font: inherit; font-size: .92rem; background: var(--surface); color: var(--ink); transition: border-color .15s; }
  textarea { resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
  button { width: 100%; margin-top: 22px; padding: 12px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 10px; font: inherit; font-weight: 600; font-size: .92rem; cursor: pointer; transition: background .15s, color .15s; }
  button:hover:not(:disabled) { background: var(--primary-dark); }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--border); }
  button.secondary:hover:not(:disabled) { background: var(--surface-muted); }
  button.chip { width: auto; margin: 0; padding: 7px 12px; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 999px; font-size: .82rem; font-weight: 600; }
  button.chip:hover:not(:disabled) { background: var(--surface-muted); }
  button.chip[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary-line); color: var(--primary); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .error { color: var(--danger); font-size: .85rem; margin-top: 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card.inset { background: var(--surface-muted); box-shadow: none; margin-top: 12px; }
  .card.notice { background: var(--warning-soft); border-color: transparent; }
  .card.accent { background: var(--primary-soft); border-color: var(--primary-line); }
  .card.list-card { padding: 4px 0; overflow: hidden; }
  button.list-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; margin: 0; padding: 13px 18px; background: transparent; color: var(--ink); border-radius: 0; text-align: left; font-weight: 400; }
  button.list-row + button.list-row { border-top: 1px solid var(--border); }
  button.list-row:hover:not(:disabled) { background: var(--surface-muted); }
  .grade-big { font-size: 1.3rem; font-weight: 700; }
  .student-heading { font-size: 1.2rem; margin: 24px 0 0; }
  .highlight { box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 40%, transparent); transition: box-shadow .3s; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .row > strong { min-width: 0; overflow-wrap: anywhere; }
  .pills { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
  .muted { color: var(--muted); font-size: .85rem; }
  .desc { color: var(--ink-soft); font-size: .88rem; line-height: 1.55; margin: 8px 0 0; }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 70px; }
  button.pw-toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: auto; margin: 0; padding: 6px 10px; background: transparent; color: var(--primary); font-size: .8rem; }
  button.pw-toggle:hover:not(:disabled) { background: var(--primary-soft); }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  input[type=radio], input[type=checkbox] { width: auto; flex-shrink: 0; margin: 0; accent-color: var(--primary); }
  .pill { white-space: nowrap; flex-shrink: 0; display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
  .pill.not_started { background: var(--surface-muted); color: var(--muted); }
  .pill.submitted { background: var(--warning-soft); color: var(--warning); }
  .pill.done { background: var(--success-soft); color: var(--success); }
  .pill.late { background: var(--late-soft); color: var(--late); }
  .pill.missing { background: var(--danger-soft); color: var(--danger); }
  .pill.used-ai { background: var(--ai-soft); color: var(--ai); }
  .avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
  .avatar-sm { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex-shrink: 0; font-size: .8rem; }
  .avatar-empty { display: flex; align-items: center; justify-content: center; background: var(--primary-soft); color: var(--primary); font-weight: 700; font-size: 1.3rem; }
  .avatar-sm.avatar-empty { font-size: .8rem; }
  .check-row { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; line-height: 1.4; }
  .check-row input { margin-top: 3px; }
  .ai-help { margin-top: 12px; }
  img.qr { width: 180px; height: 180px; display: block; margin: 14px auto; border-radius: 10px; background: #fff; padding: 6px; }
  a.linklike { color: var(--primary); text-decoration: none; font-size: .85rem; font-weight: 600; }
  a.linklike:hover { text-decoration: underline; }
  .name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dob-row { display: grid; grid-template-columns: 2fr 1fr 1.2fr; gap: 8px; }
  .field-note { color: var(--muted); font-size: .8rem; margin: 6px 0 0; line-height: 1.4; }
  .section-title { font-size: 1.05rem; font-weight: 700; margin: 28px 0 12px; letter-spacing: -.01em; }
  .section-title:first-child, .page-head + .section-title { margin-top: 0; }
  .topic-label { margin: 14px 0 6px; font-weight: 700; text-transform: uppercase; font-size: .72rem; letter-spacing: .04em; color: var(--muted); }
  #messages, .ai-chat { max-height: 360px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .msg { display: flex; flex-direction: column; max-width: 82%; }
  .msg.family { align-self: flex-end; align-items: flex-end; }
  .msg.teacher { align-self: flex-start; align-items: flex-start; }
  .msg-bubble { padding: 9px 13px; border-radius: 16px; font-size: .9rem; line-height: 1.45; white-space: pre-wrap; }
  .msg.family .msg-bubble { background: var(--primary); color: var(--on-primary); border-bottom-right-radius: 5px; }
  .msg.teacher .msg-bubble { background: var(--surface-muted); color: var(--ink); border-bottom-left-radius: 5px; }
  button.lang-switch { width: auto; margin: 0 0 0 auto; padding: 6px 12px; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 999px; font-size: .82rem; }
  button.lang-switch:hover:not(:disabled) { background: var(--surface-muted); }
  .side-foot button.lang-switch, .appbar button.lang-switch { margin: 0; }
  .translation { margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--primary-line); background: var(--surface-muted); border-radius: 0 10px 10px 0; }
  .translation .desc { white-space: pre-wrap; }
  .notif-pill { display: inline-block; margin-bottom: 14px; padding: 8px 14px; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-size: .85rem; font-weight: 600; text-decoration: none; }
  .flashcard { cursor: pointer; min-height: 110px; display: flex; flex-direction: column; justify-content: center; background: var(--surface-muted); box-shadow: none; }
  .flashcard.flipped { background: var(--success-soft); }

  /* ---- First-login tour ---------------------------------------------------------------- */
  .tour { position: fixed; inset: 0; z-index: 50; background: rgb(2 6 23 / .45); display: flex; align-items: center; justify-content: center; padding: 16px 16px 16px calc(var(--sidebar-w) + 16px); }
  .tour-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 20px; width: 100%; max-width: 420px; box-shadow: 0 20px 50px rgb(15 23 42 / .3); }
  .tour-card h2 { margin: 2px 0 6px; font-size: 1.15rem; }
  .tour-card p { margin: 0; color: var(--ink-soft); line-height: 1.5; font-size: .92rem; }
  .tour-progress { font-size: .75rem !important; font-weight: 600; color: var(--primary) !important; }
  .tour-actions { display: flex; gap: 6px; align-items: center; margin-top: 16px; }
  button.tour-next { width: auto; margin: 0; padding: 9px 16px; }
  body.touring .sidebar, body.touring .bottom-nav { z-index: 60; pointer-events: none; }
  .tour-spot { box-shadow: 0 0 0 2px var(--primary); background: var(--primary-soft) !important; color: var(--primary) !important; border-radius: 10px; }
  @media (max-width: 860px) {
    .tour { align-items: flex-end; padding: 16px 16px calc(var(--bottom-nav-h) + var(--safe-bottom) + 12px); }
  }
</style>
<script src="/i18n.js"></script>
</head>
<body>
<div class="topbar">
  <div class="badge">EB</div><div class="brand" id="brand">EduBoard Portal</div>
  <!-- Shows the language you'd switch TO, written in that language, so it's findable by
       someone who can't read the current one. -->
  <button type="button" class="lang-switch" id="lang-switch"></button>
</div>
<div class="wrap" id="app">Loading…</div>
<script>
const app = document.getElementById('app')
document.getElementById('brand').textContent = t('EduBoard Portal')
app.textContent = t('Loading…')
{
  const switcher = document.getElementById('lang-switch')
  switcher.textContent = UI_LANG === 'zh' ? 'English' : '中文'
  switcher.setAttribute('aria-label', UI_LANG === 'zh' ? 'Switch to English' : '切换到中文')
  switcher.onclick = () => setUiLang(UI_LANG === 'zh' ? 'en' : 'zh')
}
const params = new URLSearchParams(location.search)

// Offline-first data cache — deliberately separate from the service worker (see
// service-worker.js), so this page-level code can tell "served fresh" from "served
// from cache" and show an honest last-synced banner rather than silently serving stale
// data. Only GET requests are cached; every write (submit homework, send a message,
// etc.) always requires a live connection.
const API_CACHE = 'eduboard-api-v1'
const LAST_SYNCED_KEY = 'eduboard-last-synced'
let servedFromCache = false

async function api(path, opts) {
  const isGet = !opts?.method || opts.method === 'GET'
  const req = '/api' + path

  let res
  try {
    res = await fetch(req, {
      method: opts?.method || 'GET',
      headers: opts?.body ? { 'Content-Type': 'application/json' } : undefined,
      body: opts?.body ? JSON.stringify(opts.body) : undefined
    })
  } catch (networkErr) {
    // Only a genuinely unreachable server falls back to saved data. An HTTP error (above
    // all 401 "not logged in") must never be papered over with a previous session's
    // cached grades, e.g. on a shared lab computer after someone else logged out.
    if (isGet && 'caches' in window) {
      const cached = await caches.match(req)
      if (cached) {
        servedFromCache = true
        return cached.json()
      }
    }
    throw networkErr
  }

  const data = await res.json().catch(() => ({}))
  if (!res.ok) {
    if (res.status === 401) await clearSavedData()
    throw new Error(tError(data.error || 'Something went wrong'))
  }
  servedFromCache = false
  if (isGet && 'caches' in window) {
    caches.open(API_CACHE).then((cache) =>
      cache.put(
        req,
        new Response(JSON.stringify(data), { headers: { 'Content-Type': 'application/json' } })
      )
    )
    localStorage.setItem(LAST_SYNCED_KEY, new Date().toISOString())
  }
  return data
}

/** Forgets every cached API response, so nothing from this account survives a logout. */
async function clearSavedData() {
  try {
    if ('caches' in window) await caches.delete(API_CACHE)
    localStorage.removeItem(LAST_SYNCED_KEY)
  } catch {
    // Storage can be unavailable (private mode); there's nothing cached to clear then.
  }
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
}

// Polls the cheap /me/notifications endpoint while the dashboard is open, so a family
// sees "N new messages" without needing real push infrastructure — good enough for a
// tab left open, and the count is also reflected in the browser tab title so it's
// visible even when the Portal isn't the focused tab.
let notificationPollTimer = null
const BASE_TITLE = document.title

function startNotificationPolling() {
  if (notificationPollTimer) return
  updateNotificationBadge()
  notificationPollTimer = setInterval(updateNotificationBadge, 20000)
}

async function updateNotificationBadge() {
  const el = document.getElementById('notif-badge')
  if (!el) return
  let unread = 0
  try {
    ;({ unreadMessages: unread } = await api('/me/notifications'))
  } catch {
    return
  }
  document.title = unread > 0 ? `(${unread}) ${BASE_TITLE}` : BASE_TITLE
  el.innerHTML =
    unread > 0
      ? `<a href="#messages" class="notif-pill">${esc(unread === 1 ? t('1 new message from your teacher') : t('{n} new messages from your teacher', { n: unread }))}</a>`
      : ''
  document.querySelectorAll('.unread-count').forEach((count) => {
    count.hidden = unread === 0
    count.textContent = String(unread)
  })
}

function lastSyncedLabel() {
  const iso = localStorage.getItem(LAST_SYNCED_KEY)
  if (!iso) return t('unknown')
  return new Date(iso).toLocaleString(uiLocale(), {
    month: 'short',
    day: 'numeric',
    hour: 'numeric',
    minute: '2-digit'
  })
}

function offlineBannerHtml() {
  if (!servedFromCache) return ''
  return `<div class="card notice">
    <strong>${t('Viewing saved data')}</strong>
    <p class="muted" style="margin:4px 0 0">${esc(t("You're offline — last synced {when}. Reconnect to see the latest.", { when: lastSyncedLabel() }))}</p>
  </div>`
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(() => {})
  })
}

async function main() {
  const code = params.get('code')
  if (code) return renderRedeem(code)

  try {
    const me = await api('/me')
    renderDashboard(me)
    startNotificationPolling()
  } catch {
    // A thrown fetch (not an auth rejection) with nothing cached yet and no connection
    // is a genuinely different situation from "not logged in" — don't send someone
    // straight to a login form that can't succeed offline anyway.
    if (!navigator.onLine) {
      app.innerHTML = `
        <h1>${t("You're offline")}</h1>
        <p class="hint">${t('Nothing saved on this device yet. Connect once to load your dashboard — after that, it stays available offline.')}</p>
        <button onclick="location.reload()">${t('Try again')}</button>
      `
      return
    }
    renderLogin()
  }
}

// ---- Forgot password -----------------------------------------------------------------------
// The request's secret stays in this browser, so only the device that asked can set the
// new password once the teacher approves.
const RESET_KEY = 'eduboard.resetRequest'
const readReset = () => {
  try {
    return JSON.parse(localStorage.getItem(RESET_KEY) || 'null')
  } catch {
    return null
  }
}
const saveReset = (r) => {
  try {
    if (r) localStorage.setItem(RESET_KEY, JSON.stringify(r))
    else localStorage.removeItem(RESET_KEY)
  } catch {
    // Private browsing: the request just can't be picked up again after closing the page.
  }
}

function renderForgotPassword() {
  app.innerHTML = `
    <h1>${t('Forgot your password?')}</h1>
    <p class="hint">${t('Ask your teacher for a reset. Once they approve it, you choose a new password here, on this device.')}</p>
    <form id="reset-form">
      <label for="ru">${t('Username')}</label>
      <input id="ru" autocomplete="username" autocapitalize="none" required />
      <button type="submit" id="rgo">${t('Ask my teacher')}</button>
      <p class="error" id="rerr" role="alert"></p>
    </form>
    <p class="field-note" style="margin-top:18px"><a href="#" class="linklike" id="back-login">${t('Back to log in')}</a></p>
  `
  document.getElementById('back-login').onclick = (e) => {
    e.preventDefault()
    renderLogin()
  }
  document.getElementById('reset-form').onsubmit = async (e) => {
    e.preventDefault()
    const button = document.getElementById('rgo')
    button.disabled = true
    const username = document.getElementById('ru').value.trim()
    try {
      const r = await api('/auth/reset-request', { method: 'POST', body: { username } })
      saveReset({ id: r.id, secret: r.secret, username })
      renderResetWaiting()
    } catch (err) {
      document.getElementById('rerr').textContent = err.message
      button.disabled = false
    }
  }
}

let resetPoll = null
async function renderResetWaiting() {
  clearTimeout(resetPoll)
  const r = readReset()
  if (!r) return renderLogin()
  let status = 'pending'
  try {
    status = (await api(`/auth/reset-request/${encodeURIComponent(r.id)}/status`, { method: 'POST', body: { secret: r.secret } })).status
  } catch {
    status = 'expired'
  }
  if (status === 'approved') return renderNewPassword(r)
  if (status !== 'pending') {
    saveReset(null)
    app.innerHTML = `
      <h1>${t('Password reset')}</h1>
      <p class="hint">${status === 'declined' ? t('Your teacher didn’t approve this reset. Talk to them, then try again.') : t('This reset request has run out. Ask again if you still need one.')}</p>
      <button id="again">${t('Back to log in')}</button>`
    document.getElementById('again').onclick = renderLogin
    return
  }
  app.innerHTML = `
    <h1>${t('Waiting for your teacher')}</h1>
    <p class="hint">${esc(t('Your request to reset the password for {user} has been sent. Tell your teacher you asked. When they approve it, you can choose a new password here. You can close this page and come back on this device.', { user: r.username }))}</p>
    <button id="check">${t('Check again')}</button>
    <p class="field-note" style="margin-top:18px"><a href="#" class="linklike" id="cancel-reset">${t('Cancel and go back to log in')}</a></p>`
  document.getElementById('check').onclick = renderResetWaiting
  document.getElementById('cancel-reset').onclick = (e) => {
    e.preventDefault()
    saveReset(null)
    renderLogin()
  }
  resetPoll = setTimeout(() => {
    if (document.getElementById('check')) renderResetWaiting()
  }, 20000)
}

function renderNewPassword(r) {
  app.innerHTML = `
    <h1>${t('Choose a new password')}</h1>
    <p class="hint">${esc(t('Your teacher approved the reset for {user}.', { user: r.username }))}</p>
    <form id="newpw-form">
      <label for="np">${t('New password')}</label>

}

// Month names in the interface language ("March" or "3月").
const MONTHS = Array.from({ length: 12 }, (_, i) =>
  new Intl.DateTimeFormat(uiLocale(), { month: 'long' }).format(new Date(2000, i, 1))
)

function dobPickerHtml(prefix = 'dob', value = '') {
  const [vy = '', vm = '', vd = ''] = (value || '').split('-')
  const sel = (a, b) => (a === b ? ' selected' : '')
  const thisYear = new Date().getFullYear()
  const months = MONTHS.map((m, i) => {
    const v = String(i + 1).padStart(2, '0')
    return `<option value="${v}"${sel(v, vm)}>${m}</option>`
  }).join('')
  const days = Array.from({ length: 31 }, (_, i) => String(i + 1).padStart(2, '0'))
    .map((d) => `<option value="${d}"${sel(d, vd)}>${Number(d)}</option>`).join('')
  const years = Array.from({ length: 100 }, (_, i) => String(thisYear - i))
    .map((y) => `<option value="${y}"${sel(y, vy)}>${y}</option>`).join('')
  return `
    <div class="dob-row">
      <select id="${prefix}-m" aria-label="${t('Month')}"><option value="">${t('Month')}</option>${months}</select>
      <select id="${prefix}-d" aria-label="${t('Day')}"><option value="">${t('Day')}</option>${days}</select>
      <select id="${prefix}-y" aria-label="${t('Year')}"><option value="">${t('Year')}</option>${years}</select>
    </div>
  `
}

function readDob(prefix = 'dob') {
  const m = document.getElementById(`${prefix}-m`).value
  const d = document.getElementById(`${prefix}-d`).value
  const y = document.getElementById(`${prefix}-y`).value
  if (!m || !d || !y) return ''
  return `${y}-${m}-${d}`
}

const LANGUAGES = [
  ['English', 'English'], ['Chinese', 'Chinese (中文)'], ['Spanish', 'Spanish (Español)'],
  ['French', 'French (Français)'], ['German', 'German (Deutsch)'], ['Japanese', 'Japanese (日本語)'],
  ['Korean', 'Korean (한국어)'], ['Russian', 'Russian (Русский)'], ['Arabic', 'Arabic (العربية)'],
  ['Portuguese', 'Portuguese (Português)'], ['Vietnamese', 'Vietnamese (Tiếng Việt)'], ['Hindi', 'Hindi (हिन्दी)']
]

// The language AI translations go into: the interface language, unless the student
// picked a preferred language in their profile or in the Messages language list.
let readingLanguage = defaultReadingLanguage()
function setReadingLanguage(language) {
  if (!LANGUAGES.some(([v]) => v === language)) return
  readingLanguage = language
  const select = document.getElementById('msg-lang')
  if (select) select.value = language
}
/** "Chinese (中文)" in the English interface, "中文" in the Chinese one. */
function languageLabel(language) {
  return t((LANGUAGES.find(([v]) => v === language) || [language, language])[1])
}

// ---- Translating what the teacher wrote -----------------------------------------------------
// A Translate button under homework instructions, class posts and study guides. The
// translation appears under the original (not instead of it), so a student can compare
// the two and an AI mistake is visible rather than silently replacing the teacher's words.
function translateControlHtml(kind, id) {
  return `
    <div class="chip-row" style="margin-top:8px">
      <button type="button" class="chip" data-translate-kind="${esc(kind)}" data-translate-id="${esc(id)}">${t('Translate')}</button>
    </div>
    <div class="translation" data-translation hidden aria-live="polite"></div>`
}

function wireTranslateControls(root) {
  root.querySelectorAll('[data-translate-kind]').forEach((btn) => {
    if (btn.dataset.wired) return
    btn.dataset.wired = '1'
    const box = btn.parentElement.nextElementSibling
    btn.onclick = async () => {
      // Once loaded, the button just shows and hides it, until the language changes.
      if (box.dataset.language === readingLanguage) {
        box.hidden = !box.hidden
        btn.textContent = box.hidden ? t('Translate') : t('Hide translation')
        return
      }
      btn.disabled = true
      btn.textContent = t('Translating…')
      try {
        const result = await api('/me/translate', {
          method: 'POST',
          body: { kind: btn.dataset.translateKind, id: btn.dataset.translateId, targetLang: readingLanguage }
        })
        const parts = [result.title, result.description, result.body, result.studyGuide].filter(Boolean)
        box.innerHTML = `
          <p class="muted" style="margin:0 0 6px; font-size:.75rem">${esc(t('{language} translation by AI. It may contain mistakes.', { language: languageLabel(readingLanguage) }))}</p>
          <div data-translation-text>${parts
            .map((text, i) => (i === 0 && result.title ? `<p style="margin:0"><strong>${esc(text)}</strong></p>` : `<p class="desc">${esc(text)}</p>`))
            .join('')}</div>
          ${result.truncated ? `<p class="field-note">${t('Only the first part was translated because it is very long.')}</p>` : ''}
          <div class="chip-row"><button type="button" class="chip" data-listen-translation>${t('Listen to translation')}</button></div>`
        const listenTranslation = box.querySelector('[data-listen-translation]')
        listenTranslation.onclick = () =>
          speak(box.querySelector('[data-translation-text]').innerText, listenTranslation)
        box.dataset.language = readingLanguage
        box.hidden = false
        btn.textContent = t('Hide translation')
      } catch (err) {
        btn.textContent = t('Translate')
        box.hidden = false
        box.innerHTML = `<p class="error" style="margin:0">${esc(err.message)}</p>`
        box.dataset.language = ''
      } finally {
        btn.disabled = false
      }
    }
  })
}

// ---- Install as an app -----------------------------------------------------------------------
// Chrome, Edge and Android offer an install prompt the page can trigger from a button.
// iPhones and iPads have no such prompt, so they get the two steps instead. Nothing shows
// once the Portal is already running as an installed app.
let installPrompt = null
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault()
  installPrompt = e
  setupInstall()
})

function setupInstall() {
  const box = document.getElementById('install-box')
  if (!box) return
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
  if (standalone) {
    box.innerHTML = ''
  } else if (installPrompt) {
    box.innerHTML = `<p class="field-note" style="margin-top:14px">${t('Install the Portal to open it from your home screen like any other app.')}</p><div class="chip-row"><button type="button" class="chip" data-install>${t('Install the app')}</button></div>`
    box.querySelector('[data-install]').onclick = async () => {
      installPrompt.prompt()
      await installPrompt.userChoice.catch(() => {})
      installPrompt = null
      setupInstall()
    }
  } else if (ios) {
    box.innerHTML = `<p class="field-note" style="margin-top:14px">${t('To add the Portal to your home screen: tap the Share button, then “Add to Home Screen”.')}</p>`
  } else {
    box.innerHTML = ''
  }
}

// ---- AI chat (Study Helper and per-assignment help) ----------------------------------------
const QUICK_PROMPTS = [
  'Quiz me on what we covered this week',
  'Explain the main idea simply',
  'Check my understanding: I’ll explain it and you tell me what I missed'
]

function aiChatHtml(studentId, homeworkId, withPrompts = false) {
  return `
    <div data-ai-chat-root data-student="${esc(studentId)}" data-homework="${esc(homeworkId || '')}">
      <div class="ai-chat" data-ai-log></div>
      ${withPrompts ? `<div class="chip-row" style="margin-top:0">${QUICK_PROMPTS.map((q) => `<button type="button" class="chip" data-ai-prompt="${esc(t(q))}">${esc(t(q))}</button>`).join('')}</div>` : ''}
      <form data-ai-form style="margin-top:10px">
        <textarea rows="2" maxlength="2000" placeholder="${t("Ask about your homework or a topic you're stuck on…")}"></textarea>
        <button type="submit">${t('Ask')}</button>
        <p class="error" role="alert"></p>
      </form>
    </div>`
}

function aiBubblesHtml(question, reply, citations) {
  const citeHtml = citations && citations.length
    ? `<div class="muted" style="font-size:.76rem; margin-top:4px">${t('Sources:')} ${citations.map((c) => `[${c.number}] ${esc(c.title)}`).join(' · ')}</div>`
    : ''
  return `
    <div class="msg family"><div class="msg-bubble">${esc(question)}</div></div>
    <div class="msg teacher"><div class="msg-bubble" style="white-space:pre-wrap">${esc(reply)}</div>${citeHtml}<button type="button" class="chip" style="margin-top:6px" data-listen-reply>${t('Listen')}</button></div>`
}

function wireListenButtons(root) {
  root.querySelectorAll('[data-listen-reply]').forEach((btn) => {
    btn.onclick = () => speak(btn.closest('.msg').querySelector('.msg-bubble').textContent, btn)
  })
}

async function loadAiHistory(root) {
  if (root.dataset.loaded) return
  root.dataset.loaded = '1'
  const log = root.querySelector('[data-ai-log]')
  const q = new URLSearchParams({ studentId: root.dataset.student })
  if (root.dataset.homework) q.set('homeworkId', root.dataset.homework)
  try {
    const history = await api('/me/ai/history?' + q)
    log.insertAdjacentHTML('afterbegin', history.map((i) => aiBubblesHtml(i.question, i.reply)).join(''))
    wireListenButtons(log)
    log.scrollTop = log.scrollHeight
  } catch {
    // Offline or AI not set up: the chat still works for new questions.
  }
}

function wireAiChats(root) {
  root.querySelectorAll('[data-ai-help-toggle]').forEach((btn) => {
    btn.onclick = () => {
      const panel = btn.nextElementSibling
      panel.hidden = !panel.hidden
      if (!panel.hidden) {
        const chat = panel.querySelector('[data-ai-chat-root]')
        loadAiHistory(chat)
        chat.querySelector('textarea').focus()
      }
    }
  })
  root.querySelectorAll('[data-ai-chat-root]').forEach((chat) => {
    // The Study Helper's history loads when the Study tab is first opened (see showTab).
    const form = chat.querySelector('[data-ai-form]')
    const textarea = form.querySelector('textarea')
    chat.querySelectorAll('[data-ai-prompt]').forEach((chip) => {
      chip.onclick = () => {
        textarea.value = chip.dataset.aiPrompt
        form.requestSubmit()
      }
    })
    form.onsubmit = async (e) => {
      e.preventDefault()
      const message = textarea.value.trim()
      if (!message) return
      const err = form.querySelector('.error')
      const log = chat.querySelector('[data-ai-log]')
      const button = form.querySelector('button[type=submit]')
      err.textContent = ''
      button.disabled = true
      const pending = document.createElement('div')
      pending.innerHTML = `<div class="msg family"><div class="msg-bubble">${esc(message)}</div></div><div class="msg teacher"><div class="msg-bubble muted">${t('Thinking…')}</div></div>`
      log.appendChild(pending)
      log.scrollTop = log.scrollHeight
      textarea.value = ''
      try {
        const { reply, citations } = await api('/me/ai/chat', {
          method: 'POST',
          body: {
            studentId: chat.dataset.student,
            homeworkId: chat.dataset.homework || undefined,
            message,
            language: readingLanguage
          }
        })
        pending.innerHTML = aiBubblesHtml(message, reply, citations)
        wireListenButtons(pending)
        // Asking about an assignment marks it; show that on its submit form right away.
        const declared = chat.closest('.card')?.querySelector('[data-ai-declared]')
        if (chat.dataset.homework && declared && !declared.disabled) {
          declared.checked = true
          declared.disabled = true
          declared
            .closest('label')
            .insertAdjacentHTML('afterend', `<p class="field-note" data-ai-auto>${t('You asked the AI about this assignment, so it will show as “Used AI” to your teacher.')}</p>`)
        }
      } catch (ex) {
        pending.remove()
        textarea.value = message
        err.textContent = ex.message
      } finally {
        button.disabled = false
      }
      log.scrollTop = log.scrollHeight
    }
  })
}

// ---- Profiles -----------------------------------------------------------------------------
// One profile per linked student. Everything is optional. Private notes are visible only
// here; the birthday is shared with the teacher (month and day only) only if ticked.
function profileIsEmpty(p) {
  return !p.hasPhoto && !p.preferredName && !p.pronouns && !p.bio && !p.goals && !p.teacherNote && !p.dateOfBirth
}

function dismissedKey(studentId) {
  return 'profile-dismissed-' + studentId
}
function wasDismissed(studentId) {
  try { return !!sessionStorage.getItem(dismissedKey(studentId)) } catch { return false }
}
function markDismissed(studentId) {
  try { sessionStorage.setItem(dismissedKey(studentId), '1') } catch { /* private mode */ }
}

function profileCardHtml(p, studentName) {
  const id = esc(p.studentId)
  const photo = p.hasPhoto
    ? `<img class="avatar" src="/api/me/profiles/${encodeURIComponent(p.studentId)}/photo?v=${encodeURIComponent(p.updatedAt || '')}" alt="${t('Profile photo')}" />`
    : `<div class="avatar avatar-empty" aria-hidden="true">${esc((p.preferredName || studentName).slice(0, 1).toUpperCase())}</div>`
  const langOptions = [`<option value="">${t('Not set')}</option>`]
    .concat(LANGUAGES.map(([v]) => `<option value="${v}"${p.preferredLanguage === v ? ' selected' : ''}>${esc(languageLabel(v))}</option>`))
    .join('')
  const empty = profileIsEmpty(p)
  const open = empty && !wasDismissed(p.studentId)
  return `
    <div class="card profile-card">
      <div class="row" style="justify-content:flex-start; gap:12px">
        ${photo}

async function loadProfiles(me) {
  const box = document.getElementById('profiles')
  if (!box) return
  let profiles
  try {
    profiles = await api('/me/profiles')
  } catch {
    return
  }
  const names = Object.fromEntries(me.students.map((s) => [s.studentId, s.studentName.split(' ')[0]]))
  box.innerHTML = profiles.map((p) => profileCardHtml(p, names[p.studentId] || t('Student'))).join('')

  const first = profiles[0]
  const greeting = document.getElementById('greeting')
  const firstName = first && (first.preferredName || names[first.studentId])
  if (greeting && first) greeting.textContent = firstName ? t('Welcome back, {name}', { name: firstName }) : t('Welcome back')
  if (first) {
    const avatar = first.hasPhoto
      ? `<img class="avatar-sm" alt="" src="/api/me/profiles/${encodeURIComponent(first.studentId)}/photo?v=${encodeURIComponent(first.updatedAt || '')}" />`
      : `<span class="avatar-sm avatar-empty">${esc((firstName || '?').slice(0, 1).toUpperCase())}</span>`
    document.querySelectorAll('.user-avatar').forEach((el) => (el.innerHTML = avatar))
    document.querySelectorAll('.user-name').forEach((el) => (el.textContent = firstName || ''))
  }
  // A preferred language set in the profile beats the interface language for translations.
  if (first?.preferredLanguage) setReadingLanguage(first.preferredLanguage)

  // A gentle prompt on Home until each profile is started (or the student says not now).
  const nudge = document.getElementById('profile-nudge')
  const pending = profiles.find((p) => profileIsEmpty(p) && !wasDismissed(p.studentId))
  if (nudge) {
    nudge.innerHTML = pending
      ? `<div class="card accent">
           <strong>${t('Set up your profile')}</strong>
           <p class="muted" style="margin:4px 0 0">${t('Add a photo and a few words so your teacher gets to know you. Everything is optional.')}</p>
           <div class="chip-row">
             <button class="chip" data-nudge-go>${t('Set up profile')}</button>
             <button class="chip" data-nudge-later>${t('Not now')}</button>
           </div>
         </div>`
      : ''
    if (pending) {
      nudge.querySelector('[data-nudge-go]').onclick = () => {
        showTab('account')
        const form = box.querySelector(`[data-profile-form="${CSS.escape(pending.studentId)}"]`)
        if (form) {
          form.style.display = 'block'
          form.scrollIntoView({ behavior: 'smooth', block: 'start' })
        }
      }
      nudge.querySelector('[data-nudge-later]').onclick = () => {
        markDismissed(pending.studentId)
        nudge.innerHTML = ''
      }
    }
  }

  box.querySelectorAll('[data-profile-toggle]').forEach((btn) => {
    btn.onclick = () => {
      const form = box.querySelector(`[data-profile-form="${CSS.escape(btn.dataset.profileToggle)}"]`)
      const opening = form.style.display === 'none'
      form.style.display = opening ? 'block' : 'none'
      if (!opening) markDismissed(btn.dataset.profileToggle)
    }
  })
  box.querySelectorAll('[data-profile-form]').forEach((form) => {
    const studentId = form.dataset.profileForm
    const status = form.querySelector('[data-profile-status]')
    const url = `/me/profiles/${encodeURIComponent(studentId)}`
    const removeBtn = form.querySelector('[data-photo-remove]')
    if (removeBtn) {
      removeBtn.onclick = async () => {
        try {
          await api(url + '/photo', { method: 'DELETE' })
          loadProfiles(me)
        } catch (e) {
          status.textContent = e.message
        }
      }
    }
    form.onsubmit = async (e) => {
      e.preventDefault()
      status.textContent = t('Saving…')
      try {
        const file = form.querySelector('[data-photo]').files[0]
        if (file) {
          await api(url + '/photo', { method: 'POST', body: { fileName: file.name, fileData: await readFileAsBase64(file) } })
        }
        const fd = new FormData(form)
        await api(url, {
          method: 'PUT',
          body: {
            preferredName: fd.get('preferredName'),
            pronouns: fd.get('pronouns'),
            bio: fd.get('bio'),
            dateOfBirth: readDob('pdob-' + studentId),
            shareBirthday: fd.get('shareBirthday') === 'on',
            goals: fd.get('goals'),
            teacherNote: fd.get('teacherNote'),
            preferredLanguage: fd.get('preferredLanguage'),
            privateNotes: fd.get('privateNotes')
          }
        })
        markDismissed(studentId)
        await loadProfiles(me)
      } catch (ex) {
        status.textContent = ex.message
      }
    }
  })
}

function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader()
    reader.onload = () => resolve(reader.result.split(',')[1])
    reader.onerror = reject
    reader.readAsDataURL(file)
  })
}

function homeworkByTopicHtml(homework, studentId) {
  const groups = new Map()
  for (const h of homework) {
    const key = (h.topic || '').trim() || 'Other'
    if (!groups.has(key)) groups.set(key, [])
    groups.get(key).push(h)
  }
  const entries = [...groups.entries()].sort((a, b) =>
    a[0] === 'Other' ? 1 : b[0] === 'Other' ? -1 : 0
  )
  return entries
    .map(
      ([topic, items]) => `
      <p class="topic-label">${esc(topic === 'Other' ? t('Other') : topic)}</p>
      ${items.map((h) => homeworkCardHtml(h, studentId)).join('')}`
    )
    .join('')
}

    return `

        <p class="muted" style="margin:0 0 8px">${t('Quick check — {correct}/{total} correct', { correct: correctCount, total: h.questions.length })}</p>

          .map(

  return `

function renderMessages(messages) {
  const box = document.getElementById('messages')
  if (!box) return
  box.innerHTML = !messages.length
    ? `<p class="muted">${t('No messages yet — say hello below.')}</p>`
    : messages
        .map(
          (m) => `
      <div class="msg ${esc(m.sender)}">
        <div class="msg-bubble" data-msg-body="${esc(m.id)}">${esc(m.translatedBody ?? m.body)}</div>
        <div class="muted" style="font-size:.72rem; margin-top:2px; display:flex; gap:8px; align-items:center">
          <span>${formatWhen(m.createdAt)}</span>
          <a href="#" data-translate="${esc(m.id)}" style="font-size:.72rem">${m.translatedBody ? t('Show original') : t('Translate')}</a>
        </div>
      </div>`
        )
        .join('')
  box.querySelectorAll('[data-translate]').forEach((link) => {
    link.addEventListener('click', async (e) => {
      e.preventDefault()
      const id = link.getAttribute('data-translate')
      const message = lastLoadedMessages.find((m) => m.id === id)
      if (!message) return
      if (message.translatedBody) {
        message.translatedBody = null
        renderMessages(lastLoadedMessages)
        return

      link.textContent = t('Translating…')

        const { translatedBody } = await api(`/me/messages/${id}/translate`, {
          method: 'POST',

        })

        renderMessages(lastLoadedMessages)
      } catch (err) {
        link.textContent = t('Translate')
        alert(err.message || t('Translation failed. Try again in a moment.'))
      }
    })
  })
}

// Reads text aloud with the browser's own built-in speech synthesis — free, no server
// TTS cost or API key, and works offline once the page is loaded. Quality varies by
// device/OS voice, but it's a real "audio overview" with zero added infrastructure.
let currentUtterance = null
// Splits text into runs of Chinese and non-Chinese (English, and anything else written in
// Latin letters), so each run can be read by a voice that knows that language. Digits,
// spaces and punctuation stay with the run they're in. On a phone set to Chinese the
// browser's default voice is Chinese, and a Chinese voice reading English skips the words
// and reads only the letters and numbers it knows ("A1 … 1 … 0100").
function speechSegments(text) {
  const segments = []
  for (const ch of String(text)) {
    const lang = /[\u3400-\u9fff\uf900-\ufaff]/.test(ch) ? 'zh' : /\p{L}/u.test(ch) ? 'en' : null
    const last = segments[segments.length - 1]
    if (last && (lang === null || last.lang === lang || last.lang === null)) {
      last.text += ch
      if (last.lang === null) last.lang = lang
    } else {
      segments.push({ lang, text: ch })
    }
  }
  return segments
    .filter((s) => /[\p{L}\p{N}]/u.test(s.text))
    .map((s) => ({ lang: s.lang || (UI_LANG === 'zh' ? 'zh' : 'en'), text: s.text.trim() }))
}

/** The device's best voice for 'en' or 'zh', or null to let the browser pick by lang. */
function voiceFor(lang) {
  const voices = window.speechSynthesis.getVoices()
  const prefer = lang === 'zh' ? ['zh-CN', 'zh-Hans', 'zh'] : ['en-US', 'en-GB', 'en']
  for (const code of prefer) {
    const match = voices.find((v) => v.lang.replace('_', '-').toLowerCase().startsWith(code.toLowerCase()))
    if (match) return match
  }
  return null
}
// Some browsers load their voice list a moment after the page; ask early so it's ready.
if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices()
  window.speechSynthesis.addEventListener?.('voiceschanged', () => window.speechSynthesis.getVoices())
}

function speak(text, buttonEl) {
  if (!('speechSynthesis' in window)) {
    alert(t('Audio isn’t supported in this browser.'))
    return
  }
  // Remember the button's own label so "Stop" can hand it back afterwards.
  if (buttonEl && !buttonEl.dataset.label) buttonEl.dataset.label = buttonEl.textContent
  const restore = () => {
    if (buttonEl) buttonEl.textContent = buttonEl.dataset.label
  }
  if (currentUtterance) {
    window.speechSynthesis.cancel()
    currentUtterance = null
    restore()
    return
  }
  const segments = speechSegments(text)
  if (!segments.length) return
  window.speechSynthesis.cancel()
  let last = null
  for (const segment of segments) {
    const utter = new SpeechSynthesisUtterance(segment.text)
    utter.lang = segment.lang === 'zh' ? 'zh-CN' : 'en-US'
    const voice = voiceFor(segment.lang)
    if (voice) utter.voice = voice
    // A little slower for English, which most students here are learning.
    utter.rate = segment.lang === 'en' ? 0.9 : 1
    window.speechSynthesis.speak(utter)
    last = utter
  }
  const done = () => {
    if (currentUtterance !== last) return
    currentUtterance = null
    restore()
  }
  last.onend = done
  last.onerror = done
  currentUtterance = last
  if (buttonEl) buttonEl.textContent = t('Stop')
}

    }

    el.onclick = () => {
      // Always the teacher's original text. A translation has its own Listen button, so
      // a student learning English hears the English even with the translation open.
      const detail = document.getElementById('detail-' + el.dataset.listen)

// Self-study flashcards: one card at a time, tap to flip. Nothing is sent to the server;
// the whole set arrived with the materials list.
function renderFlashcards(container, cards) {
  let order = cards.map((_, i) => i)
  let pos = 0
  let flipped = false
  function draw() {
    const card = cards[order[pos]]
    container.innerHTML = `
      <div class="card flashcard${flipped ? ' flipped' : ''}" data-flip>
        <p class="muted" style="margin:0 0 6px; font-size:.75rem">${flipped ? t('Answer') : t('Question')} · ${t('card {n} of {total}', { n: pos + 1, total: cards.length })} · ${t('tap to flip')}</p>
        <p class="desc" style="margin:0; font-size:1rem">${esc(flipped ? card.back : card.front)}</p>
      </div>
      <div style="display:flex; gap:6px; margin-top:6px">
        <button class="chip" data-prev ${pos === 0 ? 'disabled' : ''}>${t('← Prev')}</button>
        <button class="chip" data-next ${pos === cards.length - 1 ? 'disabled' : ''}>${t('Next →')}</button>
        <button class="chip" data-shuffle>${t('Shuffle')}</button>
        <button class="chip" data-close>${t('Close')}</button>
      </div>`
    container.querySelector('[data-flip]').onclick = () => { flipped = !flipped; draw() }
    container.querySelector('[data-prev]').onclick = () => { pos--; flipped = false; draw() }
    container.querySelector('[data-next]').onclick = () => { pos++; flipped = false; draw() }
    container.querySelector('[data-shuffle]').onclick = () => {
      order = order.map((v) => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map((p) => p[1])
      pos = 0
      flipped = false
      draw()
    }
    container.querySelector('[data-close]').onclick = () => { container.innerHTML = '' }
  }
  draw()
}

// Self-study practice quiz, checked in the browser. Unlike homework Quick Checks it's
// not graded or recorded: the answers are meant to be seen once you check.
function renderPracticeQuiz(container, questions) {
  container.innerHTML = `
    <form class="card" data-practice-form>
      ${questions
        .map(
          (q, qi) => `
        <div style="margin-bottom:12px" data-question="${qi}">
          <p style="margin:0 0 6px; font-weight:600">${qi + 1}. ${esc(q.question)}</p>
          ${q.options
            .map(
              (o, oi) => `
            <label style="display:flex; align-items:center; gap:8px; margin:4px 0">
              <input type="radio" name="pq-${qi}" value="${oi}" /> ${esc(o)}
            </label>`
            )
            .join('')}
          <p class="desc" data-explain style="display:none; margin:6px 0 0"></p>
        </div>`
        )
        .join('')}
      <button type="submit">${t('Check answers')}</button>
      <div class="chip-row"><button type="button" class="chip" data-close>${t('Close')}</button></div>
      <p data-score style="font-weight:600"></p>
    </form>`
  const form = container.querySelector('[data-practice-form]')
  form.querySelector('[data-close]').onclick = () => { container.innerHTML = '' }
  form.onsubmit = (e) => {
    e.preventDefault()
    let right = 0
    questions.forEach((q, qi) => {
      const picked = form.querySelector(`input[name="pq-${qi}"]:checked`)
      const correct = picked && Number(picked.value) === q.answerIndex
      if (correct) right++
      const explain = form.querySelector(`[data-question="${qi}"] [data-explain]`)
      explain.style.display = 'block'
      explain.textContent = `${correct ? t('✅ Correct.') : t('❌ Answer: {answer}.', { answer: q.options[q.answerIndex] })} ${q.explanation}`
    })
    form.querySelector('[data-score]').textContent = t('You got {right} of {total}.', { right, total: questions.length })
  }
}

// The open tab lives in the URL hash (#classwork), so reloads and the back button keep
// the student where they were.
function showTab(id) {
  if (!TABS.some(([tab]) => tab === id)) id = 'home'
  document.querySelectorAll('[data-panel]').forEach((p) => (p.hidden = p.dataset.panel !== id))
  document.querySelectorAll('[data-tab]').forEach((tab) => {
    if (tab.dataset.tab === id) tab.setAttribute('aria-current', 'page')
    else tab.removeAttribute('aria-current')
  })
  if (location.hash.slice(1) !== id) {
    history.replaceState(null, '', '#' + id)
    // A new section starts at the top, like switching screens in an app.
    window.scrollTo(0, 0)
  }
  // Loading the thread marks the teacher's messages as read, so only do it when the
  // student actually opens Messages. Otherwise the unread count would vanish unseen.
  if (id === 'messages') loadMessages()
  if (id === 'study') document.querySelectorAll('[data-panel="study"] [data-ai-chat-root]').forEach(loadAiHistory)
}

function setupTabs() {
  document.querySelectorAll('[data-tab]').forEach((tab) => (tab.onclick = () => showTab(tab.dataset.tab)))
  window.onhashchange = () => showTab(location.hash.slice(1))
  showTab(location.hash.slice(1) || 'home')
}

/** Local calendar date from 'YYYY-MM-DD' (never parsed as UTC, which would shift a day). */
function parseDay(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '')
  return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : null
}

function daysFromToday(day) {
  const today = new Date()
  today.setHours(0, 0, 0, 0)
  return Math.round((day - today) / 86400000)
}

/** "Mon 28 Sep · in 3 days", "Today", "Yesterday", "2 days ago". */
function formatDue(dueDate) {
  const day = parseDay(dueDate)
  if (!day) return ''
  const label = day.toLocaleDateString(uiLocale(), { weekday: 'short', day: 'numeric', month: 'short' })
  const n = daysFromToday(day)
  const rel =
    n === 0 ? t('today')
    : n === 1 ? t('tomorrow')
    : n === -1 ? t('yesterday')
    : n > 1 ? t('in {n} days', { n })
    : t('{n} days ago', { n: -n })
  return `${label} · ${rel}`
}

/** Missing work first, then anything not yet started that's due in the next 7 days. */
function dueSoonItems(all) {
  return all
    .filter((h) => {
      if (h.timing === 'missing') return true
      if (h.status !== 'not_started') return false
      const day = parseDay(h.dueDate)
      if (!day) return false
      const n = daysFromToday(day)
      return n >= 0 && n <= 7
    })
    .sort((a, b) => {
      if ((a.timing === 'missing') !== (b.timing === 'missing')) return a.timing === 'missing' ? -1 : 1
      return (a.dueDate || '').localeCompare(b.dueDate || '')
    })
}

function dueSummary(all) {
  const missing = all.filter((h) => h.timing === 'missing').length
  const soon = dueSoonItems(all).length - missing
  const parts = []
  if (missing) parts.push(t('{n} missing', { n: missing }))
  if (soon) parts.push(t('{n} due this week', { n: soon }))
  return parts.length ? parts.join(' · ') : t("You're all caught up.")
}

function dueSoonHtml(all, multi) {
  const items = dueSoonItems(all)
  if (!items.length) {
    return `<div class="card"><p class="muted" style="margin:0">${t('Nothing due in the next 7 days, and nothing missing.')}</p></div>`
  }
  return `<div class="card list-card">${items
    .map(
      (h) => `
    <button type="button" class="list-row" data-open-hw="${esc(h.id)}" data-student="${esc(h.studentId)}">
      <span style="min-width:0">
        <strong>${esc(h.title)}</strong>
        <span class="muted" style="display:block">${esc(h.className)}${multi ? ' · ' + esc(h.studentName) : ''} · ${esc(formatDue(h.dueDate))}</span>
      </span>
      ${h.timing === 'missing' ? `<span class="pill missing">${t('Missing')}</span>` : `<span class="pill not_started">${t('To do')}</span>`}
    </button>`
    )
    .join('')}</div>`
}

// A few short steps that walk a new student through the real tabs (each step opens the
// tab it describes and highlights it) rather than screenshots of them. Shown once per
// account; finishing or skipping records it on the server. "Show the tour again" in
// Account replays it without touching that record.
const TOUR_STEPS = [
  {
    tab: 'home',
    title: (name) => (name ? t('Welcome, {name}!', { name }) : t('Welcome!')),
    body: () =>
      `${t("This is your class Portal. Here's a quick look around. It takes about 30 seconds.")} ${t('Prefer Chinese? Tap 中文 at the top right.')}`

function startTour({ name = '', record = true } = {}) {
  document.getElementById('tour')?.remove()
  const previousFocus = document.activeElement
  let step = 0

  const overlay = document.createElement('div')
  overlay.id = 'tour'
  overlay.className = 'tour'
  overlay.innerHTML = `
    <div class="tour-card" role="dialog" aria-modal="true" aria-labelledby="tour-title" aria-describedby="tour-body">
      <p class="tour-progress" aria-live="polite"></p>
      <h2 id="tour-title"></h2>
      <p id="tour-body"></p>
      <div class="tour-actions">
        <button type="button" class="chip" data-tour-skip>${t('Skip tour')}</button>
        <span style="flex:1"></span>
        <button type="button" class="chip" data-tour-back>${t('Back')}</button>
        <button type="button" class="tour-next" data-tour-next>${t('Next')}</button>
      </div>
    </div>`
  document.body.appendChild(overlay)
  document.body.classList.add('touring')
  const next = overlay.querySelector('[data-tour-next]')
  const back = overlay.querySelector('[data-tour-back]')

  function finish() {
    document.querySelectorAll('.tour-spot').forEach((el) => el.classList.remove('tour-spot'))
    overlay.remove()
    document.body.classList.remove('touring')
    document.removeEventListener('keydown', onKey, true)
    if (record) api('/me/onboarding', { method: 'POST' }).catch(() => {})
    if (previousFocus && previousFocus.focus) previousFocus.focus()
  }

  function render() {
    const s = TOUR_STEPS[step]
    showTab(s.tab)
    document.querySelectorAll('.tour-spot').forEach((el) => el.classList.remove('tour-spot'))
    // Point at the tab this step is about (step 5 covers Grades and Messages).
    const spots = step === 4 ? ['grades', 'messages'] : step === 0 ? [] : [s.tab]
    // The same section is in the sidebar (computers) and the bottom bar or app bar
    // (phones); point at whichever one is on screen.
    spots.forEach((tab) => {
      const visible = [...document.querySelectorAll(`[data-tab="${tab}"]`)].find(
        (el) => el.getClientRects().length > 0
      )
      visible?.classList.add('tour-spot')
    })
    overlay.querySelector('.tour-progress').textContent = t('{step} of {total}', { step: step + 1, total: TOUR_STEPS.length })
    overlay.querySelector('#tour-title').textContent = s.title(name)
    overlay.querySelector('#tour-body').textContent = s.body()
    back.hidden = step === 0
    next.textContent = step === 0 ? t('Show me around') : step === TOUR_STEPS.length - 1 ? t('Done') : t('Next')
    next.focus()
  }

  // Keyboard: Escape skips, arrows move, and Tab stays inside the card.
  function onKey(e) {
    if (e.key === 'Escape') {
      e.preventDefault()
      finish()
    } else if (e.key === 'ArrowRight') {
      e.preventDefault()
      next.click()
    } else if (e.key === 'ArrowLeft' && step > 0) {
      e.preventDefault()
      back.click()
    } else if (e.key === 'Tab') {
      const focusable = [...overlay.querySelectorAll('button:not([hidden])')]
      const i = focusable.indexOf(document.activeElement)
      e.preventDefault()
      focusable[(i + (e.shiftKey ? -1 : 1) + focusable.length) % focusable.length].focus()
    }
  }
  document.addEventListener('keydown', onKey, true)

  next.onclick = () => {
    if (step === TOUR_STEPS.length - 1) {
      finish()
      showTab('account')
    } else {
      step++
      render()
    }
  }
  back.onclick = () => {
    step--
    render()
  }
  overlay.querySelector('[data-tour-skip]').onclick = () => {
    finish()
    showTab('home')
  }
  render()
}

       </div>
     </section>

     <section class="panel" id="panel-account" data-panel="account" hidden>
       ${pageHead(t('Account'), t('Your profile, language and sign-in.'))}
       <div class="section-title">${t('Profile')}</div>
       <div id="profiles"></div>
       <div class="section-title">${t('Language')} · Language</div>
       <div class="card">
         <p class="muted" style="margin:0 0 8px">${t('Choose the language for buttons and menus. Anything your teacher writes can also be translated with its Translate button.')}</p>
         <div class="chip-row" role="group" aria-label="${t('Language')}">
           <button type="button" class="chip" data-ui-lang="en" aria-pressed="${UI_LANG === 'en'}">English</button>
           <button type="button" class="chip" data-ui-lang="zh" aria-pressed="${UI_LANG === 'zh'}">中文</button>
         </div>
       </div>
       <div class="section-title">${t('Email updates')}</div>
       <div class="card">
         <p class="muted" style="margin:0 0 8px">${t("Get a weekly summary emailed to you — grades, attendance, what's due, and any class updates.")}</p>
         <form id="email-form" style="display:flex; gap:8px">
           <input id="email-input" type="email" placeholder="you@example.com" style="flex:1; box-sizing:border-box; padding:10px; border:1px solid var(--border); border-radius:10px; font:inherit" />
           <button type="submit" style="width:auto; margin-top:0">${t('Save')}</button>
         </form>
         <p id="email-status" class="muted" style="margin:6px 0 0; font-size:.8rem"></p>
       </div>
       <div class="section-title">${t('Password')}</div>
       <div class="card">
         <p class="muted" style="margin:0 0 8px">${t('Change your password. This signs you out on every other device and cancels any quick-login QR codes.')}</p>
         <form id="password-form">
           <label for="pw-current">${t('Current password')}</label>
           ${passwordFieldHtml('pw-current', 'current-password')}
           <label for="pw-new">${t('New password (at least 8 characters)')}</label>
           ${passwordFieldHtml('pw-new', 'new-password', 'minlength="8"')}
           <button type="submit">${t('Change password')}</button>
         </form>
         <p id="password-status" class="muted" style="margin:6px 0 0; font-size:.8rem"></p>
       </div>
       <div class="section-title">${t('This device')}</div>
       <div class="card">
         <div style="display:flex; gap:8px; flex-wrap:wrap">
           <button class="chip" id="qr">${t('Get quick-login QR')}</button>
           <button class="chip" id="replay-tour">${t('Show the tour again')}</button>
           <button class="chip" id="logout">${t('Log out')}</button>
         </div>
         <div id="qrbox"></div>
         <div id="install-box"></div>
       </div>
     </section>
      </main>
    </div>
    <nav class="bottom-nav" aria-label="${t('Sections')}">${TABS.filter(([id]) => id !== 'account').map((tab) => navButton('bottom-item', tab)).join('')}</nav>
  </div>`

  setupTabs()
  wirePasswordToggles()
  document.querySelectorAll('[data-lang-switch]').forEach((btn) => {
    btn.onclick = () => setUiLang(UI_LANG === 'zh' ? 'en' : 'zh')
  })
  setupInstall()
  document.querySelectorAll('[data-ui-lang]').forEach((btn) => {
    btn.onclick = () => {
      if (btn.dataset.uiLang !== UI_LANG) setUiLang(btn.dataset.uiLang)
    }
  })
  wireTranslateControls(app)
  if (me.onboarded === false && !servedFromCache) startTour({ name: me.students[0]?.studentName.split(' ')[0] })
  document.querySelectorAll('[data-open-hw]').forEach((row) => {
    row.onclick = () => {
      showTab('classwork')
      const detailId = `${row.dataset.openHw}-${row.dataset.student}`
      const detail = document.getElementById('detail-' + detailId)
      if (!detail) return
      detail.style.display = 'block'
      const card = detail.closest('.card')
      card.scrollIntoView({ behavior: 'smooth', block: 'center' })
      card.classList.add('highlight')
      setTimeout(() => card.classList.remove('highlight'), 1600)
    }
  })

  document.querySelectorAll('[data-toggle]').forEach((el) => {
    el.onclick = () => {
      const detail = document.getElementById('detail-' + el.dataset.toggle)
      detail.style.display = detail.style.display === 'none' ? 'block' : 'none'
    }
  })

  document.querySelectorAll('[data-submit]').forEach((form) => {
    form.onsubmit = async (e) => {
      e.preventDefault()
      const hwId = form.dataset.submit
      const studentId = form.dataset.student
      const textAnswer = form.querySelector('[data-answer]').value
      const fileInput = form.querySelector('[data-file]')
      const file = fileInput.files[0]
      const err = form.querySelector('.error')
      const aiBox = form.querySelector('[data-ai-declared]')
      err.textContent = ''

      try {
        const fileData = file ? await readFileAsBase64(file) : null
        await api(`/me/homework/${hwId}/submit`, {
          method: 'POST',
          body: {
            studentId,
            textAnswer,
            fileName: file?.name || null,
            fileData,
            // Only the student's own tick is a declaration. A box ticked automatically
            // (they asked the AI here) is already recorded on the server.
            aiDeclared: !!aiBox?.checked && !aiBox.disabled
          }
        })
        location.reload()
      } catch (ex) {
        err.textContent = ex.message
      }
    }
  })

  document.querySelectorAll('[data-quiz]').forEach((form) => {
    form.onsubmit = async (e) => {
      e.preventDefault()
      const hwId = form.dataset.quiz
      const studentId = form.dataset.student
      const err = form.querySelector('.error')
      err.textContent = ''

      const answers = {}
      form.querySelectorAll('[name^="q-"]').forEach((el) => {
        if (el.type === 'radio' && !el.checked) return
        answers[el.name.slice(2)] = el.value
      })

      try {
        await api(`/me/homework/${hwId}/answers`, { method: 'POST', body: { studentId, answers } })
        location.reload()
      } catch (ex) {
        err.textContent = ex.message
      }
    }
  })

  wireAiChats(app)

  loadProfiles(me)
  loadClassStory()
  loadPortfolio()
  loadMaterials()
  document.getElementById('msg-lang').onchange = (e) => setReadingLanguage(e.target.value)
  document.getElementById('msg-form').onsubmit = async (e) => {
    e.preventDefault()
    const input = document.getElementById('msg-body')
    if (!input.value.trim()) return
    await api('/me/messages', { method: 'POST', body: { body: input.value.trim() } })
    input.value = ''
    loadMessages()
  }

  api('/me/account').then((acc) => {
    document.getElementById('email-input').value = acc.email || ''
  })
  document.getElementById('password-form').onsubmit = async (e) => {
    e.preventDefault()
    const status = document.getElementById('password-status')
    status.textContent = t('Saving…')
    try {
      await api('/me/password', {
        method: 'POST',
        body: {
          currentPassword: document.getElementById('pw-current').value,
          newPassword: document.getElementById('pw-new').value
        }
      })
      e.target.reset()
      status.textContent = t('Password changed. Other devices have been signed out.')
    } catch (ex) {
      status.textContent = ex.message
    }
  }

  document.getElementById('email-form').onsubmit = async (e) => {
    e.preventDefault()
    const status = document.getElementById('email-status')
    status.textContent = t('Saving…')
    try {
      await api('/me/account', {
        method: 'POST',
        body: { email: document.getElementById('email-input').value.trim() }
      })
      status.textContent = t('Saved.')
    } catch (ex) {
      status.textContent = ex.message
    }
  }

  document.getElementById('qr').onclick = async () => {
    const { qrDataUrl } = await api('/me/qr', { method: 'POST' })
    document.getElementById('qrbox').innerHTML = `
      <img class="qr" src="${qrDataUrl}" />
      <p class="muted" style="text-align:center">${t('Save this image — opening it logs you in with one tap, no typing.')}</p>
      <a class="linklike" href="${qrDataUrl}" download="eduboard-login.png">${t('Download')}</a>
    `
  }
  document.getElementById('replay-tour').onclick = () =>
    startTour({ name: me.students[0]?.studentName.split(' ')[0], record: false })

  document.getElementById('logout').onclick = async () => {
    await clearSavedData()
    await api('/auth/logout', { method: 'POST' }).catch(() => {})
    location.reload()
  }
}

main()
</script>
</body>
</html>
