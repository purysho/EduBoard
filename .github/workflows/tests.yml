name: Tests

# Lint, typecheck and both test suites (desktop and Portal) on every push to main and
# every pull request. Separate from the Windows installer build, which skips changes that
# can't affect it; the tests never skip.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Check release script syntax
        run: bash -n tools/mac/smoke-test.sh
      # Before the desktop tests: some of them publish to a real test Portal.
      - name: Install Portal dependencies
        working-directory: portal
        run: npm ci
      - run: npm test
      - name: Portal tests
        working-directory: portal
        run: npm test

  # The real app, opened the way a teacher would: every screen with a term of sample data,
  # grades on screen, Chinese, and password protection (tools/e2e/smoke.mjs).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-vite build
      # Playwright drives Electron directly; no browser download is needed.
      - run: npm install --no-save playwright@1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Smoke test
        run: xvfb-run --auto-servernum node tools/e2e/smoke.mjs
