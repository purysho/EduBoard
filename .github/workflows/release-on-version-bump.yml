name: Release on version bump

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/release-on-version-bump.yml

permissions:
  contents: write
  actions: write

jobs:
  publish-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish an unreleased package version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already published."
            exit 0
          fi

          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          else
            echo "$tag already exists; publishing that tagged build."
          fi

          # Tags pushed with GITHUB_TOKEN do not trigger another push workflow.
          # workflow_dispatch is explicitly allowed, so dispatch the existing
          # multi-platform Release workflow at the version tag.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
