name: Release asset repair

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to repair (for example v0.7.5)
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/release-repair.yml
      - tools/release/repair-release-assets.sh

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EVENT_NAME: ${{ github.event_name }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out repair tooling
        uses: actions/checkout@v7

      - name: Repair and verify release assets
        shell: bash
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch)
              bash tools/release/repair-release-assets.sh --tag "$INPUT_TAG"
              ;;
            push)
              bash tools/release/repair-release-assets.sh --audit-recent
              ;;
            *)
              echo "::error::Unsupported event: $EVENT_NAME"
              exit 2
              ;;
          esac
