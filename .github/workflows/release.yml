name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Pushing a v* tag names the release. Run by hand (Actions → Release → Run workflow),
  # the tag is made here from package.json's version, at the commit being built.
  tag:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          name="v$(node -p "require('./package.json').version")"
          existing=$(git ls-remote --tags origin "refs/tags/$name^{}" "refs/tags/$name" | head -1 | cut -f1)
          if [ -n "$existing" ]; then
            if [ "$(git ls-remote --tags origin "refs/tags/$name^{}" | cut -f1)" != "$GITHUB_SHA" ] && [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::$name already exists at another commit. Bump the version in package.json first."
              exit 1
            fi
          else
            git tag "$name" "$GITHUB_SHA"
            git push origin "$name"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & publish
        shell: bash
        run: |
          # GitHub Actions always exports a secret's env var, even when the secret was
          # never set — as an empty string, never as a genuinely absent variable.
          # electron-builder's mac signing path checks CSC_LINK for *presence*, not
          # truthiness, so a "" value still reads as "a certificate was provided", tries
          # to load it as a file, and fails outright. CSC_IDENTITY_AUTO_DISCOVERY: false
          # alone doesn't fix this — it only disables electron-builder's own automatic
          # keychain search. The only reliable fix is to unset these vars entirely when
          # their secrets aren't configured, so the child process never sees the key.
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "$APPLE_ID" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          npm run ${{ matrix.script }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing / notarization — all optional. With none of these repo secrets
          # set, the build stays unsigned exactly as before. See docs/CODE_SIGNING.md.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Generate SHA256 checksums for this platform's installers
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const path = require('path');
            const dir = 'dist';
            const exts = ['.exe', '.dmg', '.zip', '.AppImage'];
            const lines = fs.readdirSync(dir)
              .filter((f) => exts.includes(path.extname(f)))
              .sort()
              .map((f) => {
                const hash = crypto.createHash('sha256').update(fs.readFileSync(path.join(dir, f))).digest('hex');
                return \`\${hash}  \${f}\`;
              });
            fs.writeFileSync(path.join(dir, 'SHA256SUMS-${{ matrix.os }}.txt'), lines.join('\n') + '\n');
          "

      - name: Upload checksums to the release
        shell: bash
        run: gh release upload "${{ needs.tag.outputs.name }}" "dist/SHA256SUMS-${{ matrix.os }}.txt" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
