name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & publish
        run: npm run ${{ matrix.script }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing / notarization — all optional. Unset (the default until these
          # repo secrets are added), electron-builder falls back to an unsigned build
          # exactly as before. See docs/CODE_SIGNING.md for what to add and where.
          #
          # GitHub Actions always exports a secret's env var, even when the secret was
          # never set — as an empty string, never as "absent". electron-builder's mac
          # signing path treats CSC_LINK: "" as "a certificate was provided" rather than
          # "none configured", tries to load it as a file, and the build fails outright.
          # CSC_IDENTITY_AUTO_DISCOVERY: false stops it from treating an empty CSC_LINK
          # as a signing request — it only disables the *automatic* keychain search, so
          # an explicit non-empty CSC_LINK still signs normally once the secret is set.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Generate SHA256 checksums for this platform's installers
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const path = require('path');
            const dir = 'dist';
            const exts = ['.exe', '.dmg', '.zip', '.AppImage'];
            const lines = fs.readdirSync(dir)
              .filter((f) => exts.includes(path.extname(f)))
              .sort()
              .map((f) => {
                const hash = crypto.createHash('sha256').update(fs.readFileSync(path.join(dir, f))).digest('hex');
                return \`\${hash}  \${f}\`;
              });
            fs.writeFileSync(path.join(dir, 'SHA256SUMS-${{ matrix.os }}.txt'), lines.join('\n') + '\n');
          "

      - name: Upload checksums to the release
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" "dist/SHA256SUMS-${{ matrix.os }}.txt" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
