name: Test build (Windows installer)

# Builds a Windows installer for any branch, so a change can be tried on a real PC by
# downloading and double-clicking, with no terminal. Nothing is published: the
# installer is attached to the workflow run as a downloadable artifact (kept 14 days).
# Tagged releases still go through release.yml.
on:
  push:
    branches: [main]
    # A private repository has a monthly Actions allowance (Windows minutes count
    # double), so changes that can't affect the desktop installer don't build one.
    paths-ignore:
      - 'portal/**'
      - 'docs/**'
      - '**/*.md'
      - '**/*.MD'
      - '*.cmd'
  workflow_dispatch:

# Write: each build replaces the "test-latest" pre-release that Update-EduBoard.cmd
# installs from.
permissions:
  contents: write

# One build at a time, so two pushes can't race to replace test-latest.
concurrency:
  group: test-build
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer (unsigned)
        shell: bash
        run: npm run build:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Report packaged output size
        run: node tools/package-size/report.mjs dist/win-unpacked


      - uses: actions/upload-artifact@v7
        with:
          name: EduBoard-Windows-${{ github.sha }}
          path: |
            dist/EduBoard-Setup.exe
            dist/EduBoard-Portable.exe
          retention-days: 14
          if-no-files-found: error

      - name: Publish as the "test-latest" pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete test-latest --yes --cleanup-tag || true
          gh release create test-latest dist/EduBoard-Setup.exe dist/EduBoard-Portable.exe \
            --prerelease --target "$GITHUB_SHA" \
            --title "Test build ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d))" \
            --notes "Built from $GITHUB_REF_NAME at $GITHUB_SHA. Installed by Update-EduBoard.cmd."

      # Proves the just-published test installer is retrievable with the workflow token.
      # Raw unauthenticated/API-style requests from shared runners can hit GitHub's
      # secondary rate limits even when the release itself is healthy, so CI uses gh's
      # authenticated release download path. The teacher updater remains public/tokenless
      # (with optional token support) and keeps its own retry/fallback behavior.
      - name: Check the published test installer can be downloaded
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'eduboard-test-download'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh release download test-latest --repo "${{ github.repository }}" --pattern "EduBoard-Setup.exe" --dir $dir --clobber
          $downloaded = Join-Path $dir 'EduBoard-Setup.exe'
          $built = 'dist/EduBoard-Setup.exe'
          if (-not (Test-Path $downloaded)) { throw 'The published test installer was not downloaded.' }
          if ((Get-Item $downloaded).Length -ne (Get-Item $built).Length) {
            throw 'The published test installer size does not match the built installer.'
          }
          $downloadHash = (Get-FileHash $downloaded -Algorithm SHA256).Hash
          $builtHash = (Get-FileHash $built -Algorithm SHA256).Hash
          if ($downloadHash -ne $builtHash) { throw 'The published test installer hash does not match the built installer.' }
          Write-Host "Published test installer download verified ($((Get-Item $downloaded).Length) bytes, SHA-256 $downloadHash)."
