# Dependabot opens pull requests to update dependencies: once a month, with the minor and
# patch updates for each part grouped into one pull request. Security fixes come as soon as
# they're published once "Dependabot security updates" is on (Settings → Code security).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      desktop-minor-and-patch:
        update-types: [minor, patch]
    # electron-vite (the build tool) supports Vite up to 7. Take Vite's next major, and the
    # React plugin that needs it, together with an electron-vite release that supports it.
    ignore:
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: '@vitejs/plugin-react'
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /portal
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      portal-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
