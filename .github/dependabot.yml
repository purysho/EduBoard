# Dependabot opens pull requests to update dependencies: once a month, with the minor and
# patch updates for each part grouped into one pull request. Security fixes come as soon as
# they're published once "Dependabot security updates" is on (Settings → Code security).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      desktop-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /portal
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      portal-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
